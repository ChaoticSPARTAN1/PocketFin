"title":"Start here",
"html":"\u003cp align=\"center\"\u003e\n  \u003cpicture\u003e\n    \u003csource media=\"(prefers-color-scheme: dark)\" srcset=\"docs/images/readme/pocketfin-banner-dark.png\"\u003e\n    \n    \u003cimg src=\"docs/images/readme/pocketfin-banner-dark.png\" alt=\"PocketFin: Jellyfin on your Analogue Pocket\" width=\"100%\"\u003e\n  \u003c/picture\u003e\n\u003c/p\u003e\n\u003ch1 id=\"h-pocketfin-jellyfin-on-your-analogue-pocket\"\u003ePocketFin: Jellyfin on your Analogue Pocket\u003c/h1\u003e\n\u003cp\u003e\u003cstrong\u003eRead the guide:\u003c/strong\u003e \u003ca href=\"docs/PocketFin-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/PocketFin-Guide.pdf\u003c/a\u003e (opens right on GitHub), or download and\ndouble-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e for the interactive version.\u003c/p\u003e\n\u003cp align=\"center\"\u003e\u003cimg src=\"docs/images/pocket-core-launch.png\" alt=\"The Jellyfin core\u0026#x27;s launch screen on the Analogue Pocket\" width=\"480\"\u003e\u003cbr\u003e\n\u003csub\u003eThe core's launch screen, redrawn from the core's own files. Jellyfin logo (c) the Jellyfin contributors, CC BY-SA 4.0.\u003c/sub\u003e\u003c/p\u003e\n\u003cp\u003ePocketFin is an openFPGA core and app that brings a Jellyfin-style media library to the Analogue\nPocket. It plays video with sound using a JPEG decoder built into the FPGA. On the Pocket it appears\nas the core \u003cstrong\u003eJellyfin\u003c/strong\u003e (made by ChaoticSPARTAN1).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWatch videos straight from the SD card, no network or extra hardware needed.\u003c/strong\u003e Put your own videos\non the card and they show up in the \u003cstrong\u003eOn this Pocket\u003c/strong\u003e tile on the Home screen.\u003c/p\u003e\n\u003ch3 id=\"h-add-your-own-videos-to-the-card-short-version\"\u003eAdd your own videos to the card (short version)\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003eInstall PocketFin on the card first (\u003ca href=\"#docs/Install.md\"\u003eInstall\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eOn a Windows PC, install \u003ca href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePython 3.12+\u003c/a\u003e, FFmpeg (for example\n\u003ccode\u003ewinget install Gyan.FFmpeg\u003c/code\u003e) and PyAV: \u003ccode\u003epy -3 -m pip install av\u003c/code\u003e. FFmpeg and PyAV are separate\nfree software under their own licences (FFmpeg: LGPL or GPL depending on the build; PyAV: BSD) and\nare not included in PocketFin. See \u003ca href=\"#docs/What-You-Need.md\"\u003eWhat you need\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eDownload this repository (green \u003cstrong\u003eCode\u003c/strong\u003e button, \u003cstrong\u003eDownload ZIP\u003c/strong\u003e) and unzip it.\u003c/li\u003e\n\u003cli\u003eIn that folder, run: \u003ccode\u003epy -3 tools\\make_offline_library.py --video \"C:\\Videos\\My Video.mp4\"\u003c/code\u003e\n(add more \u003ccode\u003e--video \"...\"\u003c/code\u003e for more files).\u003c/li\u003e\n\u003cli\u003eIt converts each video to the Pocket's format (256x144 pictures at the video's own frame rate, about\n0.9 GB per hour) and writes the result to \u003ccode\u003ebuild\\offline-library\\\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eCopy everything inside \u003ccode\u003ebuild\\offline-library\\\u003c/code\u003e onto the root of the Pocket's SD card and allow it\nto replace files. Its files go to \u003ccode\u003eAssets\\pocketlive\\common\\\u003c/code\u003e and \u003ccode\u003eAssets\\pocketlive\\ChaoticSPARTAN1.Jellyfin\\\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003ePut the card back, open the Jellyfin core and press \u003cstrong\u003eA\u003c/strong\u003e: your videos are in \u003cstrong\u003eOn this Pocket\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eLimits: up to 256 videos, 12 pack files of 2 GiB each (about 24 hours in total). Only add videos you\nown or have the right to copy. Details and troubleshooting: \u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-what-it-does\"\u003eWhat it does\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eJellyfin-style screens\u003c/strong\u003e: Home rows (Continue Watching, Next Up, Latest), My Media, details pages,\nposters and a resume bar, in the style of the official Jellyfin apps.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOffline library on the SD card\u003c/strong\u003e: your own videos, or titles copied from your Jellyfin server.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eLive Jellyfin over the link cable\u003c/strong\u003e: the Pocket has no Wi-Fi, but with a ModRetro Chromatic running\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e and a link cable, the Pocket\nbrowses your server and streams from it (\u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003ehow\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eEach title at its own frame rate\u003c/strong\u003e (24, 25 or 30 fps), resume where you stopped, watched marks.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eHome\u003c/th\u003e\n\u003cth\u003eDetails\u003c/th\u003e\n\u003cth\u003ePlaying\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cimg src=\"docs/images/ui-home.png\" alt=\"Home\"\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cimg src=\"docs/images/ui-details.png\" alt=\"Details\"\u003e\u003c/td\u003e\n\u003ctd\u003e\u003cimg src=\"docs/images/ui-playback.png\" alt=\"Playback\"\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eScreenshots come from the project's own screen renderer with made-up sample titles.\u003c/p\u003e\n\u003ch2 id=\"h-quick-start\"\u003eQuick start\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eDownload this repository and unzip it.\u003c/li\u003e\n\u003cli\u003eCopy the contents of \u003ccode\u003erelease\\SD\\\u003c/code\u003e onto the root of your Pocket's SD card. Then, \u003cstrong\u003efirst install\nonly (skip if the card already has them)\u003c/strong\u003e, also copy \u003ccode\u003erelease\\SD-sample-library\\\u003c/code\u003e and\n\u003ccode\u003erelease\\SD-first-install-saves\\\u003c/code\u003e. Or, on Windows, run \u003ccode\u003e.\\Install-PocketFin.ps1 -Card E:\\\u003c/code\u003e (use\nyour card's drive letter). \u003ca href=\"#docs/Install.md\"\u003eFull steps\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eOn the Pocket: \u003cstrong\u003eOpenfpga\u003c/strong\u003e (or the core list) \u0026gt; \u003cstrong\u003eJellyfin\u003c/strong\u003e \u0026gt; \u003cstrong\u003eRun\u003c/strong\u003e. Press \u003cstrong\u003eA\u003c/strong\u003e and play the\nbuilt-in \u003cstrong\u003eTest Pattern\u003c/strong\u003e to check picture and sound.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-documentation\"\u003eDocumentation\u003c/h2\u003e\n\u003cp\u003eThe \u003ca href=\"#docs/Home.md\"\u003edocs\u003c/a\u003e cover everything in plain steps: \u003ca href=\"#docs/What-You-Need.md\"\u003eWhat you need\u003c/a\u003e,\n\u003ca href=\"#docs/Install.md\"\u003eInstall\u003c/a\u003e, \u003ca href=\"#docs/First-Run.md\"\u003eFirst run\u003c/a\u003e, \u003ca href=\"#docs/Using-PocketFin.md\"\u003eUsing PocketFin\u003c/a\u003e,\n\u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e, \u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e,\n\u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting and recovery\u003c/a\u003e, \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e,\n\u003ca href=\"#docs/Building-from-Source.md\"\u003eBuilding from source\u003c/a\u003e, \u003ca href=\"#docs/AI-Prompt-Examples.md\"\u003eAI prompt examples\u003c/a\u003e,\n\u003ca href=\"#docs/Credits-and-Licences.md\"\u003eCredits and licences\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAs one PDF:\u003c/strong\u003e \u003ca href=\"docs/PocketFin-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003edocs/PocketFin-Guide.pdf\u003c/a\u003e holds every page, with a clickable table of\ncontents; GitHub shows it right in the browser.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOffline:\u003c/strong\u003e download or clone this repository, then double-click \u003cstrong\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e\u003c/strong\u003e in its\nmain folder. It opens all of these pages in your browser, with pictures, without a server or an internet\nconnection (keep it in the repository folder: it loads the pictures from \u003ccode\u003edocs/\u003c/code\u003e). It is built from the\nMarkdown pages by \u003ccode\u003etools/build_docs_html.py\u003c/code\u003e (the PDF by \u003ccode\u003etools/build_docs_pdf.py\u003c/code\u003e).\u003c/p\u003e\n\u003ch3 id=\"h-optional-remote-pilot-for-the-chromatic-side\"\u003eOptional: Remote Pilot for the Chromatic side\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemote Pilot\u003c/a\u003e is a free PC companion for the\nChromatic (with Jellymatic): it shows the Chromatic's screen in your web browser and lets you press its\nbuttons and read its logs from the PC, over USB or Wi-Fi. For PocketFin users it makes the Chromatic\nside easier: set up its Wi-Fi, Jellyfin sign-in and Pocket link from your desk, and troubleshoot the\nlink without juggling two handhelds. Its privacy eye (on by default) hides addresses and network names\non screen, which helps when you make a bug report, and an AI assistant such as Claude or Codex can use\nit to help you test. It is optional: you do not need it to play videos from the SD card.\nMore: \u003ca href=\"#docs/Wireless-Jellyfin.md:optional-remote-pilot\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-related-projects\"\u003eRelated projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: Jellyfin on the ModRetro Chromatic, and\nthe Chromatic side of the link-cable connection.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: see and control a Chromatic\nfrom your PC (screen, buttons, logs) over USB or Wi-Fi.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-status\"\u003eStatus\u003c/h2\u003e\n\u003cp\u003eVersion 1.0.0. The app in \u003ccode\u003erelease/\u003c/code\u003e (\u003ccode\u003epjlive.elf\u003c/code\u003e) was built from this source. The bitstream and OS\nkernel are the files that have run on an Analogue Pocket (only \u003ccode\u003ecore.json\u003c/code\u003e gained the version number\nand project link). The previous app build (SHA-256 \u003ccode\u003ea19aa677...\u003c/code\u003e) was tested on a Pocket; this build\nchanges only the About screen's text and the source of the font atlas, which is now generated directly\nfrom Google's Roboto font (same glyph sizes and spacing; only tiny anti-aliasing differences). Live streaming through a Chromatic works but is\nlimited by the link cable: pictures are small and soft, and playback may pause briefly to refill. See the \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-disclaimer\"\u003eDisclaimer\u003c/h2\u003e\n\u003cp\u003ePocketFin is an independent project, not affiliated with, endorsed by or supported by Analogue or the\nJellyfin project. Analogue and Analogue Pocket are trademarks of Analogue Enterprises Limited.\nJellyfin is a trademark of its owners; the Jellyfin logo is used under CC BY-SA 4.0. ModRetro and\nChromatic are trademarks of ModRetro, Inc.; PocketFin is not affiliated with ModRetro either.\nUse it at your own risk. It is provided as is, without warranty, and support is not guaranteed.\u003c/p\u003e\n\u003ch2 id=\"h-contributing\"\u003eContributing\u003c/h2\u003e\n\u003cp\u003eBug reports, fixes and pull requests are welcome: see \u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e. Report\nsecurity problems privately: see \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003ePocketFin is free software: GPL-3.0-or-later (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms and one\nadditional permission under GPL section 7 (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ekeep the author attribution \"ChaoticSPARTAN1\" in the credits and in any About or credits screen\n(section 7(b)), and do not misrepresent the origin of the work (section 7(c));\u003c/li\u003e\n\u003cli\u003eyou may convey the FPGA bitstream, which combines PocketFin with the Analogue Pocket Framework and\nIntel/Altera FPGA IP; its Corresponding Source need not include the source of those parts.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThird-party parts keep their own licences (\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eCreated by ChaoticSPARTAN1.\u003c/strong\u003e\u003c/li\u003e\n\u003cli\u003eopenfpgaOS runtime and SDK by ThinkElastic (Apache-2.0).\u003c/li\u003e\n\u003cli\u003ecore_jpeg hardware JPEG decoder by Ultra-Embedded.com (Apache-2.0).\u003c/li\u003e\n\u003cli\u003eVexiiRiscv CPU by SpinalHDL (MIT).\u003c/li\u003e\n\u003cli\u003eRoboto font by Google (Apache-2.0); the app's glyph atlas is generated from it by \u003ccode\u003etools/build_roboto_atlas.py\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003emusl libc, dlmalloc, lib9660 and cram0_phy by their authors (MIT, MIT-0, ISC, MIT).\u003c/li\u003e\n\u003cli\u003eJellyfin logo by the Jellyfin contributors (CC BY-SA 4.0).\u003c/li\u003e\n\u003cli\u003eAnalogue Pocket Framework by Analogue.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eFull list: \u003ca href=\"#docs/Credits-and-Licences.md\"\u003eCredits and licences\u003c/a\u003e.\u003c/p\u003e"

"html":"\u003ch1 id=\"h-pocketfin-wiki\"\u003ePocketFin wiki\u003c/h1\u003e\n\u003cpicture\u003e\n  \u003csource media=\"(prefers-color-scheme: dark)\" srcset=\"docs/images/pocketfin-logo-dark.png\"\u003e\n  \n  \u003cimg src=\"docs/images/pocketfin-logo-dark.png\" alt=\"PocketFin\" width=\"420\"\u003e\n\u003c/picture\u003e\n\u003cp\u003ePocketFin puts a Jellyfin-style media library on the Analogue Pocket. It runs as an openFPGA core\ncalled \u003cstrong\u003eJellyfin\u003c/strong\u003e. You can watch videos stored on the SD card with nothing else, or browse and\nstream your Jellyfin server through a ModRetro Chromatic and a link cable.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRead it as one PDF:\u003c/strong\u003e \u003ca href=\"docs/PocketFin-Guide.pdf\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ePocketFin-Guide.pdf\u003c/a\u003e (opens right on GitHub). \u003cstrong\u003eOr offline:\u003c/strong\u003e\ndownload or clone the repository, then double-click \u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in its main folder. Every\npage here opens in your browser, with pictures, with no internet connection needed.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/pocket-core-launch.png\" alt=\"The Jellyfin core\u0026#x27;s launch screen\" width=\"400\"\u003e\u003c/p\u003e\n\u003cp\u003e\u003cem\u003eThe core's launch screen. Jellyfin logo (c) the Jellyfin contributors, CC BY-SA 4.0.\u003c/em\u003e\u003c/p\u003e\n\u003ch2 id=\"h-pages\"\u003ePages\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePage\u003c/th\u003e\n\u003cth\u003eWhat it covers\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/What-You-Need.md\"\u003eWhat you need\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe Pocket, an SD card, and what is optional\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Install.md\"\u003eInstall\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eCopying PocketFin onto the SD card, updating, removing\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/First-Run.md\"\u003eFirst run\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eStarting the core and playing the test pattern\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Using-PocketFin.md\"\u003eUsing PocketFin\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eButtons, Home rows, On this Pocket, playback, quality\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eThe Chromatic link and setting up a Jellyfin server at home\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003ePutting your own videos (or server titles) on the card\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting and recovery\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eBlack screen, flashing backlight, going back to the previous files\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eShort answers\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Building-from-Source.md\"\u003eBuilding from source\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eRebuilding the app, the core and the release\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md\"\u003eAI prompt examples\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eReady-made prompts for Claude, Codex and other assistants\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ca href=\"#docs/Credits-and-Licences.md\"\u003eCredits and licences\u003c/a\u003e\u003c/td\u003e\n\u003ctd\u003eWho made what, and under which licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-related-projects\"\u003eRelated projects\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e: Jellyfin on the ModRetro Chromatic and\nthe Chromatic side of the link cable.\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemotePilot\u003c/a\u003e: an optional PC companion that\nshows and controls the Chromatic from your PC (\u003ca href=\"#docs/Wireless-Jellyfin.md:optional-remote-pilot\"\u003ewhy it helps\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-disclaimer\"\u003eDisclaimer\u003c/h2\u003e\n\u003cp\u003ePocketFin is an independent project, not affiliated with, endorsed by or supported by Analogue, ModRetro or\nthe Jellyfin project. Jellyfin is a trademark of its owners. Use it at your own risk; support is not\nguaranteed.\u003c/p\u003e"

"path":"docs/What-You-Need.md",
"title":"What you need",
"html":"\u003ch1 id=\"h-what-you-need\"\u003eWhat you need\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; What you need\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/What-You-Need.md:to-watch-videos-from-the-card\"\u003eTo watch videos from the card\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/What-You-Need.md:to-add-your-own-videos\"\u003eTo add your own videos\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/What-You-Need.md:to-use-your-jellyfin-server-live\"\u003eTo use your Jellyfin server live\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-to-watch-videos-from-the-card\"\u003eTo watch videos from the card\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eAn \u003cstrong\u003eAnalogue Pocket\u003c/strong\u003e with current firmware (openFPGA support; firmware 2.2 or newer).\u003c/li\u003e\n\u003cli\u003eIts \u003cstrong\u003eSD card\u003c/strong\u003e, and a way to copy files to it: a card reader on your computer, or the Pocket's own\nUSB card access if your firmware offers it.\u003c/li\u003e\n\u003cli\u003eAbout \u003cstrong\u003e5 MB\u003c/strong\u003e free for the core and demo, plus room for your videos (about 0.9 GB per hour).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThat is all. No network, no Chromatic, no server.\u003c/p\u003e\n\u003ch2 id=\"h-to-add-your-own-videos\"\u003eTo add your own videos\u003c/h2\u003e\n\u003cp\u003eA Windows PC (other systems work for the tools, but the steps here are written for Windows) with:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003ePython 3.12 or newer\u003c/strong\u003e: \u003ca href=\"https://www.python.org/downloads/\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://www.python.org/downloads/\u003c/a\u003e (tick \"Add python.exe to PATH\" when\ninstalling). The commands below use \u003ccode\u003epy -3\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFFmpeg\u003c/strong\u003e (version 7 or newer) with \u003ccode\u003effmpeg.exe\u003c/code\u003e and \u003ccode\u003effprobe.exe\u003c/code\u003e on your PATH. One easy way:\n\u003ccode\u003ewinget install Gyan.FFmpeg\u003c/code\u003e, then open a new terminal. FFmpeg is separate software under its own\nlicence (LGPL or GPL depending on the build); PocketFin does not include it.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003ePyAV\u003c/strong\u003e: \u003ccode\u003epy -3 -m pip install av\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eSee \u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-to-use-your-jellyfin-server-live\"\u003eTo use your Jellyfin server live\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eA \u003cstrong\u003eJellyfin server\u003c/strong\u003e at home (free; see \u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eA \u003cstrong\u003eModRetro Chromatic\u003c/strong\u003e with \u003cstrong\u003eJellymatic\u003c/strong\u003e installed: \u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/ChaoticSPARTAN1/Jellymatic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003eA \u003cstrong\u003elink cable\u003c/strong\u003e that fits the link ports of both consoles.\u003c/li\u003e\n\u003cli\u003eA 2.4 GHz Wi-Fi network for the Chromatic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Install.md\"\u003eInstall\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Install.md",
"title":"Install",
"html":"\u003ch1 id=\"h-install-on-the-pocket\"\u003eInstall on the Pocket\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Install\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Install.md:what-is-in-release\"\u003eWhat is in release/\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Install.md:install-by-copying-files\"\u003eInstall by copying files\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Install.md:install-with-the-windows-script\"\u003eInstall with the Windows script\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Install.md:update-to-a-new-version\"\u003eUpdate to a new version\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Install.md:remove-pocketfin\"\u003eRemove PocketFin\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePocketFin adds its own folders to the card. It does not change other cores, games, saves or settings.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-release\"\u003eWhat is in release/\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFolder\u003c/th\u003e\n\u003cth\u003eWhat it holds\u003c/th\u003e\n\u003cth\u003eWhen to copy it\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease/SD/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe core (\u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e), the app and OS (\u003ccode\u003eAssets/pocketlive/common/\u003c/code\u003e), the platform entry and the licence notices\u003c/td\u003e\n\u003ctd\u003eFirst install and every update\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease/SD-sample-library/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe demo library (a 20-second test pattern) and the file that tells the Pocket which library files to load\u003c/td\u003e\n\u003ctd\u003eFirst install only, or to go back to the demo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease/SD-first-install-saves/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eEmpty save files for the app's log and offline cache (\u003ccode\u003eSaves/pocketlive/common/\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eOnly if your card does not have them yet\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e\u003ccode\u003erelease/SHA256SUMS.txt\u003c/code\u003e lists a checksum for every file.\u003c/p\u003e\n\u003ch2 id=\"h-install-by-copying-files\"\u003eInstall by copying files\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eTurn the Pocket off and take out the SD card (or use the Pocket's USB card access). Put the card in\nyour computer.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBack up the card\u003c/strong\u003e (copy everything on it to a folder on your computer). This is your way back\nif anything goes wrong.\u003c/li\u003e\n\u003cli\u003eOpen \u003ccode\u003erelease/SD/\u003c/code\u003e and copy everything inside it (the folders \u003ccode\u003eAssets\u003c/code\u003e, \u003ccode\u003eCores\u003c/code\u003e, \u003ccode\u003eNotices\u003c/code\u003e,\n\u003ccode\u003ePlatforms\u003c/code\u003e) onto the root of the card. Say yes if asked to merge folders.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFirst install only (skip if the card already has them):\u003c/strong\u003e do the same with everything inside\n\u003ccode\u003erelease/SD-sample-library/\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFirst install only (skip if the card already has them):\u003c/strong\u003e do the same with everything inside\n\u003ccode\u003erelease/SD-first-install-saves/\u003c/code\u003e, but \u003cstrong\u003eskip any file that already exists\u003c/strong\u003e (choose \"Skip these\nfiles\"). Never replace existing saves.\u003c/li\u003e\n\u003cli\u003eEject the card safely, put it back in the Pocket and see \u003ca href=\"#docs/First-Run.md\"\u003eFirst run\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eDo not change any file in \u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e. In particular, never edit\n\u003ccode\u003einteract.json\u003c/code\u003e: other versions of that file made the Pocket hang at a black screen.\u003c/p\u003e\n\u003ch2 id=\"h-install-with-the-windows-script\"\u003eInstall with the Windows script\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eInstall-PocketFin.ps1\u003c/code\u003e does the same steps and checks every file:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003e.\\Install-PocketFin.ps1 -Card E:\\            # use your card's drive letter\n.\\Install-PocketFin.ps1 -Card E:\\ -WhatIf    # only show what it would do\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt checks the release against \u003ccode\u003eSHA256SUMS.txt\u003c/code\u003e, copies \u003ccode\u003erelease/SD/\u003c/code\u003e, adds the demo library only if\nthe card has no PocketFin library, creates save files only where none exist, and reads every copied\nfile back to check it. Any card file it replaces is first copied to \u003ccode\u003ebackups\\\u0026lt;date-time\u0026gt;\\\u003c/code\u003e next to\nthe script. It never needs a password or address and sends nothing anywhere.\u003c/p\u003e\n\u003cp\u003eIf Windows refuses to run the script, run this once in the same window first:\n\u003ccode\u003eSet-ExecutionPolicy -Scope Process Bypass\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-update-to-a-new-version\"\u003eUpdate to a new version\u003c/h2\u003e\n\u003cp\u003eCopy only \u003ccode\u003erelease/SD/\u003c/code\u003e (or run the script again). Your library, your saves and the list of library\nfiles stay as they are. Do not copy \u003ccode\u003eSD-sample-library\u003c/code\u003e over your own library unless you want the\ndemo back.\u003c/p\u003e\n\u003ch2 id=\"h-remove-pocketfin\"\u003eRemove PocketFin\u003c/h2\u003e\n\u003cp\u003eBy hand, delete these from the card:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eAssets/pocketlive/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eos.bin\u003c/code\u003e, \u003ccode\u003epjlive.elf\u003c/code\u003e and \u003ccode\u003epjlive.ini\u003c/code\u003e in \u003ccode\u003eAssets/pocketlive/common/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ePlatforms/pocketlive.json\u003c/code\u003e and \u003ccode\u003ePlatforms/_images/pocketlive.bin\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNotices/PocketLive/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003eOptional, your library and saves: the rest of \u003ccode\u003eAssets/pocketlive/common/\u003c/code\u003e and \u003ccode\u003eSaves/pocketlive/\u003c/code\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOr run \u003ccode\u003e.\\Install-PocketFin.ps1 -Card E:\\ -Remove\u003c/code\u003e (add \u003ccode\u003e-RemoveLibraryAndSaves\u003c/code\u003e to remove those too).\nThe script moves everything to \u003ccode\u003ebackups\\\u003c/code\u003e on your PC instead of deleting it.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/First-Run.md\"\u003eFirst run\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/First-Run.md",
"title":"First run",
"html":"\u003ch1 id=\"h-first-run\"\u003eFirst run\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; First run\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/First-Run.md:start-the-core\"\u003eStart the core\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/First-Run.md:the-start-screen\"\u003eThe start screen\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/First-Run.md:play-the-test-pattern\"\u003ePlay the test pattern\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/First-Run.md:quitting\"\u003eQuitting\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-start-the-core\"\u003eStart the core\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eTurn on the Pocket.\u003c/li\u003e\n\u003cli\u003eOpen \u003cstrong\u003eopenFPGA\u003c/strong\u003e in the main menu (on some firmware it is the core list), choose \u003cstrong\u003eJellyfin\u003c/strong\u003e,\nthen \u003cstrong\u003eRun\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/pocket-core-launch.png\" alt=\"Launch screen\" width=\"360\"\u003e\u003c/p\u003e\n\u003cp\u003eIt takes a few seconds to load. The app tests its own JPEG decoder at every start.\u003c/p\u003e\n\u003ch2 id=\"h-the-start-screen\"\u003eThe start screen\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-source.png\" alt=\"Start screen\" width=\"480\"\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eThe top lines show the self-test: \u003cstrong\u003eRuntime: ok\u003c/strong\u003e and \u003cstrong\u003eFPGA JPEG decoder: ok\u003c/strong\u003e mean the core works.\n\u003cstrong\u003eLibrary on card\u003c/strong\u003e shows how many titles are on the card.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eA\u003c/strong\u003e opens a library: the one on this Pocket, or the one saved from your Chromatic if you have used\none before (then \u003cstrong\u003eSelect\u003c/strong\u003e opens the card's library instead).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eX\u003c/strong\u003e looks for a Chromatic on the link cable now. It also looks by itself every few seconds.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eY\u003c/strong\u003e shows \u003cstrong\u003eAbout and credits\u003c/strong\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-play-the-test-pattern\"\u003ePlay the test pattern\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003ePress \u003cstrong\u003eA\u003c/strong\u003e. Home opens with the built-in \u003cstrong\u003eTest Pattern\u003c/strong\u003e.\u003c/li\u003e\n\u003cli\u003ePress \u003cstrong\u003eA\u003c/strong\u003e on it to open its details, then \u003cstrong\u003eA\u003c/strong\u003e again to play.\u003c/li\u003e\n\u003cli\u003eYou should see moving colour bars with a running counter and hear a steady tone. Press \u003cstrong\u003eL\u003c/strong\u003e to show\nframe counters, \u003cstrong\u003eB\u003c/strong\u003e to stop.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-home-sample.png\" alt=\"Home with the demo library\" width=\"400\"\u003e\n\u003cimg src=\"docs/images/ui-details-sample.png\" alt=\"Test pattern details\" width=\"400\"\u003e\u003c/p\u003e\n\u003cp\u003eIf picture and sound work, the core is installed correctly. Next, add your own videos\n(\u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e) or connect to your server (\u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eWireless\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-quitting\"\u003eQuitting\u003c/h2\u003e\n\u003cp\u003eUse the Pocket's own menu (the Analogue button) and quit the core. \u003cstrong\u003eB\u003c/strong\u003e on the start screen does not\nquit; it shows that hint instead. Quitting properly lets the Pocket save the app's log, where you\nstopped each title and the saved Chromatic library to the card.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Using-PocketFin.md\"\u003eUsing PocketFin\u003c/a\u003e\u003c/p\u003e"
}
]

"path":"docs/Using-PocketFin.md",
"title":"Using PocketFin",
"html":"\u003ch1 id=\"h-using-pocketfin\"\u003eUsing PocketFin\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Using PocketFin\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:buttons\"\u003eButtons\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:home\"\u003eHome\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:on-this-pocket\"\u003eOn this Pocket\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:details-and-playback\"\u003eDetails and playback\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:frame-rate-and-picture-quality\"\u003eFrame rate and picture quality\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Using-PocketFin.md:settings-in-the-pockets-menu\"\u003eSettings in the Pocket's menu\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-buttons\"\u003eButtons\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhere\u003c/th\u003e\n\u003cth\u003eButton\u003c/th\u003e\n\u003cth\u003eWhat it does\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eStart screen\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eOpen a library (this Pocket's, or the one saved from your Chromatic)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eSelect\u003c/td\u003e\n\u003ctd\u003eOpen this Pocket's library when a saved Chromatic library also exists\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eX\u003c/td\u003e\n\u003ctd\u003eLook for a Chromatic on the link cable now\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eY\u003c/td\u003e\n\u003ctd\u003eAbout and credits (B or Y returns)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHome and folders\u003c/td\u003e\n\u003ctd\u003eD-pad\u003c/td\u003e\n\u003ctd\u003eMove between rows (up/down) and titles (left/right)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003eOpen the title or folder\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eX\u003c/td\u003e\n\u003ctd\u003ePlay the selected title from the start\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eB\u003c/td\u003e\n\u003ctd\u003eBack\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eY\u003c/td\u003e\n\u003ctd\u003eGo to Home\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eL / R\u003c/td\u003e\n\u003ctd\u003ePrevious / next page in a large folder\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eSelect\u003c/td\u003e\n\u003ctd\u003eWith this Pocket's library: back to the start screen. With a Chromatic: change the frame-rate limit\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDetails\u003c/td\u003e\n\u003ctd\u003eA\u003c/td\u003e\n\u003ctd\u003ePlay, or Resume / From start (choose with left/right)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eX\u003c/td\u003e\n\u003ctd\u003ePlay from the start\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eB\u003c/td\u003e\n\u003ctd\u003eBack\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWhile playing\u003c/td\u003e\n\u003ctd\u003eStart\u003c/td\u003e\n\u003ctd\u003ePause; Start or A resumes\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eLeft / Right\u003c/td\u003e\n\u003ctd\u003eJump back / forward 10 seconds\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eB\u003c/td\u003e\n\u003ctd\u003eStop (the position is kept for Resume)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eL\u003c/td\u003e\n\u003ctd\u003eShow playback numbers, then (with a Chromatic) link numbers, then hide\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003c/td\u003e\n\u003ctd\u003eR\u003c/td\u003e\n\u003ctd\u003eFilm mode on/off: the screen refresh follows the video's frame rate\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eTo quit the core, use the Pocket's own menu (Analogue button).\u003c/p\u003e\n\u003ch2 id=\"h-home\"\u003eHome\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-home.png\" alt=\"Home\" width=\"480\"\u003e\u003c/p\u003e\n\u003cp\u003eHome works like the Jellyfin apps: a large picture of the selected title at the top, then rows such as\n\u003cstrong\u003eContinue Watching\u003c/strong\u003e, \u003cstrong\u003eNext Up\u003c/strong\u003e, \u003cstrong\u003eLatest in Movies\u003c/strong\u003e and \u003cstrong\u003eMy Media\u003c/strong\u003e (your libraries as tiles).\nTitles you started have a progress bar; watched titles have a tick. The top right says where the\nlibrary comes from: \u003cstrong\u003eOn this Pocket\u003c/strong\u003e, or \u003cstrong\u003eChromatic connected\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-home-posters.png\" alt=\"Poster row\" width=\"400\"\u003e \u003cimg src=\"docs/images/ui-library.png\" alt=\"Folder\" width=\"400\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-on-this-pocket\"\u003eOn this Pocket\u003c/h2\u003e\n\u003cp\u003eEverything stored on the SD card opens from the \u003cstrong\u003eOn this Pocket\u003c/strong\u003e tile, at the end of the \u003cstrong\u003eMy Media\u003c/strong\u003e\nrow. It is there both when you use the card on its own and when a Chromatic is connected, so your own\nvideos are always one tile away. Titles that are listed but not stored on the card say \u003cstrong\u003eNot on this\nPocket\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-details-not-on-card.png\" alt=\"A title that is not on the card\" width=\"400\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-details-and-playback\"\u003eDetails and playback\u003c/h2\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-details.png\" alt=\"Details\" width=\"400\"\u003e \u003cimg src=\"docs/images/ui-playback.png\" alt=\"Playing\" width=\"400\"\u003e\u003c/p\u003e\n\u003cp\u003eThe details page shows the year, length, rating, genres and description, with \u003cstrong\u003eResume\u003c/strong\u003e and \u003cstrong\u003eFrom\nstart\u003c/strong\u003e when you stopped part way. During playback a strip shows the title and progress for a few\nseconds after each button press. Where you stopped and what you watched are saved on the Pocket and\nwritten to the card when you quit the core.\u003c/p\u003e\n\u003ch2 id=\"h-frame-rate-and-picture-quality\"\u003eFrame rate and picture quality\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFrom the card\u003c/strong\u003e: each title plays at its own frame rate (23.976, 24, 25, 29.97 or 30 fps) at\n256x144. Faster videos were halved when they were converted.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eFrom a Chromatic\u003c/strong\u003e: the picture comes from your server through the link cable, so it is smaller\n(about 128x72) and softer. \u003cstrong\u003eSelect\u003c/strong\u003e cycles the frame-rate limit between 24, 30 and 60 fps; a 24 fps\nfilm still plays at 24. The link may not carry the higher rates; the app then says what rate it\nplays at. See \u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-settings-in-the-pockets-menu\"\u003eSettings in the Pocket's menu\u003c/h2\u003e\n\u003cp\u003eThe Pocket's \u003cstrong\u003eCore Settings\u003c/strong\u003e and \u003cstrong\u003eControls\u003c/strong\u003e screens for this core still show labels left over from\nthe openFPGA template it is built on (for example Analogizer options and game-style button names).\nPocketFin ignores them; leave them as they are. The app uses its own defaults: link speed Auto\n(384 kHz, falling back to 256 kHz), a 2-second buffer, normal volume.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Wireless-Jellyfin.md\"\u003eConnecting to Jellyfin wirelessly\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Wireless-Jellyfin.md",
"title":"Jellyfin wirelessly",
"html":"\u003ch1 id=\"h-connecting-to-jellyfin-wirelessly\"\u003eConnecting to Jellyfin wirelessly\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Connecting to Jellyfin wirelessly\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:the-two-ways-to-get-your-library\"\u003eThe two ways to get your library\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:set-up-a-jellyfin-server-at-home\"\u003eSet up a Jellyfin server at home\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:connect-through-a-chromatic\"\u003eConnect through a Chromatic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:what-to-expect\"\u003eWhat to expect\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:optional-remote-pilot\"\u003eOptional: Remote Pilot\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Wireless-Jellyfin.md:privacy\"\u003ePrivacy\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-the-two-ways-to-get-your-library\"\u003eThe two ways to get your library\u003c/h2\u003e\n\u003cp\u003eThe Analogue Pocket has \u003cstrong\u003eno Wi-Fi\u003c/strong\u003e. PocketFin supports two ways to use your Jellyfin server:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eLive, through a ModRetro Chromatic.\u003c/strong\u003e The Chromatic joins your Wi-Fi and talks to your server;\nthe Pocket talks to the Chromatic through a link cable. You browse your server's Home,\nfolders and posters on the Pocket and stream titles. The Chromatic needs\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eJellymatic\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCopied to the card from a PC.\u003c/strong\u003e \u003ccode\u003etools/make_offline_library.py --jellyfin\u003c/code\u003e copies titles from your\nserver to the SD card, with their posters and descriptions. No wireless at all; see\n\u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThere is no direct PC-to-Pocket wireless connection.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/connection-diagram.svg\" alt=\"How the pieces connect\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-set-up-a-jellyfin-server-at-home\"\u003eSet up a Jellyfin server at home\u003c/h2\u003e\n\u003cp\u003eJellyfin is free media-server software. If you already have a server, skip to the next part.\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eOn a computer that stays on at home (a PC or a NAS), download Jellyfin Server from\n\u003ca href=\"https://jellyfin.org/downloads\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://jellyfin.org/downloads\u003c/a\u003e and install it.\u003c/li\u003e\n\u003cli\u003eOn that computer, open a web browser at \u003ccode\u003ehttp://localhost:8096\u003c/code\u003e and follow the setup: create your\nuser name and password, and add your libraries (for example a \u003cstrong\u003eMovies\u003c/strong\u003e folder and a \u003cstrong\u003eShows\u003c/strong\u003e\nfolder).\u003c/li\u003e\n\u003cli\u003eFind the server's address on your home network. In the Jellyfin dashboard it is listed under\n\u003cstrong\u003eNetworking\u003c/strong\u003e; it looks like \u003ccode\u003ehttp://your-server:8096\u003c/code\u003e (your computer's name or local address and\nport 8096).\u003c/li\u003e\n\u003cli\u003eLeave \u003cstrong\u003etranscoding\u003c/strong\u003e turned on (it is on by default): the server converts video into the small\nformat the Chromatic and Pocket can show.\u003c/li\u003e\n\u003cli\u003eKeep the server on the same home network as the Chromatic.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-connect-through-a-chromatic\"\u003eConnect through a Chromatic\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eInstall Jellymatic on the Chromatic and set it up there: Wi-Fi network, server address and sign-in\n(follow the Jellymatic instructions). Check that the Chromatic itself can browse your server.\u003c/li\u003e\n\u003cli\u003eConnect the Pocket and the Chromatic with a link cable.\u003c/li\u003e\n\u003cli\u003eOn the Pocket, start the \u003cstrong\u003eJellyfin\u003c/strong\u003e core. It looks for a Chromatic by itself every few seconds\n(or press \u003cstrong\u003eX\u003c/strong\u003e on the start screen).\u003c/li\u003e\n\u003cli\u003eOn the Chromatic, open Jellyfin and choose \u003cstrong\u003ePocket link\u003c/strong\u003e (in Jellymatic's menu).\u003c/li\u003e\n\u003cli\u003eThe Pocket's header changes to \u003cstrong\u003eChromatic connected\u003c/strong\u003e and your server's Home appears.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eWhile connected, the Pocket quietly saves your Home, folders and posters. When you unplug the cable,\nthat saved library stays browsable (titles that are not on the card are dimmed), and the app goes back\nto the Chromatic when you plug it in again.\u003c/p\u003e\n\u003cp\u003e\u003cimg src=\"docs/images/ui-source.png\" alt=\"Start screen\" width=\"400\"\u003e\u003c/p\u003e\n\u003ch2 id=\"h-what-to-expect\"\u003eWhat to expect\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe link cable is slow (a few tens of kilobytes per second). Pictures are about 128x72 and soft,\nand playback may pause now and then to refill its buffer.\u003c/li\u003e\n\u003cli\u003eBrowsing, posters and descriptions work well; the first visit to Home takes a little while, later\nvisits come from the saved copy.\u003c/li\u003e\n\u003cli\u003eFor the best picture, copy titles to the card instead (\u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eThe connection uses only the link cable; the Pocket never sees your server address, password or\ntokens. Those stay on the Chromatic.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-optional-remote-pilot\"\u003eOptional: Remote Pilot\u003c/h2\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemote Pilot\u003c/a\u003e is a free program for your\nWindows PC that shows the Chromatic's screen in a web browser, and lets you press its buttons, read its\nlogs and save screenshots, over a USB cable or your home Wi-Fi. It works with a Chromatic running\nJellymatic. You do not need it for PocketFin; it just makes the Chromatic side easier:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eFirst-time setup from your desk\u003c/strong\u003e: go through the Chromatic's Wi-Fi, Jellyfin sign-in and Pocket\nlink screens with the on-screen buttons, while watching the Chromatic's screen large on the PC.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eTroubleshooting the link\u003c/strong\u003e: watch the Chromatic's screen and log on the PC while you hold the\nPocket, instead of juggling two handhelds.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eCleaner bug reports\u003c/strong\u003e: its privacy eye (on by default) hides addresses and network names on the\nscreen. Saved files are not masked, so check them before sharing.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eHelp from an AI assistant\u003c/strong\u003e: Claude, Codex or another assistant can drive the Chromatic through it\nto help you test, within the safety rules in its documentation.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIt is not needed to play videos from the SD card.\u003c/p\u003e\n\u003ch2 id=\"h-privacy\"\u003ePrivacy\u003c/h2\u003e\n\u003cp\u003eYour Wi-Fi details and server sign-in are set on the Chromatic (or, for the PC tool, in\n\u003ccode\u003eprivate/jellyfin-connection.txt\u003c/code\u003e on your PC, which Git ignores). Never post them in issues, logs or\nscreenshots; see \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/Offline-Library.md",
"title":"Offline library",
"html":"\u003ch1 id=\"h-offline-library-on-the-card\"\u003eOffline library on the card\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Offline library\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:how-it-works\"\u003eHow it works\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:add-your-own-videos\"\u003eAdd your own videos\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:copy-titles-from-your-jellyfin-server\"\u003eCopy titles from your Jellyfin server\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:where-the-files-go-on-the-card\"\u003eWhere the files go on the card\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:limits\"\u003eLimits\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Offline-Library.md:troubleshooting\"\u003eTroubleshooting\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eOnly add videos you own or have the right to copy.\u003c/p\u003e\n\u003ch2 id=\"h-how-it-works\"\u003eHow it works\u003c/h2\u003e\n\u003cp\u003eThe Pocket cannot play ordinary video files. \u003ccode\u003etools/make_offline_library.py\u003c/code\u003e converts them on your PC\ninto the Pocket's format: 256x144 Motion-JPEG pictures at the video's own frame rate with IMA ADPCM\nsound. It writes a \u003cstrong\u003elibrary\u003c/strong\u003e file (Home rows, titles, descriptions, pictures) and one or more\n\u003cstrong\u003epack\u003c/strong\u003e files (the videos). The Pocket's FPGA decodes the pictures.\u003c/p\u003e\n\u003cp\u003eYou need Python, FFmpeg and PyAV on the PC: see \u003ca href=\"#docs/What-You-Need.md\"\u003eWhat you need\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-add-your-own-videos\"\u003eAdd your own videos\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eOpen a terminal (PowerShell) in the PocketFin folder.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eRun, with your own file names:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\make_offline_library.py --video \"C:\\Videos\\My Video.mp4\" --video \"C:\\Videos\\Holiday 2024.mkv\"\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAny format FFmpeg can read works (MP4, MKV, AVI, MOV, ...). The title shown on the Pocket is the\nfile name without its extension. A picture from each video becomes its poster.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eWait: conversion takes roughly as long as the video, or less on a fast PC. It prints a summary at\nthe end.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eThe result is in \u003ccode\u003ebuild\\offline-library\\\u003c/code\u003e. Copy \u003cstrong\u003eeverything inside it\u003c/strong\u003e onto the root of the\nPocket's SD card and let it replace the files it asks about.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eStart the Jellyfin core, press \u003cstrong\u003eA\u003c/strong\u003e: your videos are in the \u003cstrong\u003eOn this Pocket\u003c/strong\u003e tile in My Media.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eA 60-second \u003cstrong\u003eTest Pattern\u003c/strong\u003e is added too, so the card always has something to play; add\n\u003ccode\u003e--no-test-pattern\u003c/code\u003e to leave it out.\u003c/p\u003e\n\u003cp\u003eEach run makes a \u003cstrong\u003ecomplete new library\u003c/strong\u003e: list every video you want on the card, not only new ones.\nThe new library replaces the old one on the card.\u003c/p\u003e\n\u003ch2 id=\"h-copy-titles-from-your-jellyfin-server\"\u003eCopy titles from your Jellyfin server\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e\u003cp\u003eCopy \u003ccode\u003ejellyfin-connection.example.txt\u003c/code\u003e to \u003ccode\u003eprivate\\jellyfin-connection.txt\u003c/code\u003e and fill in your\nserver address (for example \u003ccode\u003ehttp://your-server:8096\u003c/code\u003e), user name and password, or an API key.\nThis file stays on your PC; Git ignores the \u003ccode\u003eprivate\u003c/code\u003e folder.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eRun:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\make_offline_library.py --jellyfin --max-titles 4 --max-gb 8\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt takes titles from Continue Watching first, then the newest, up to the limits, and also stores\nyour Home rows, folders, posters and descriptions. Titles that are listed but not copied show\n\u003cstrong\u003eNot on this Pocket\u003c/strong\u003e. You can combine \u003ccode\u003e--jellyfin\u003c/code\u003e with \u003ccode\u003e--video\u003c/code\u003e.\u003c/p\u003e\u003c/li\u003e\n\u003cli\u003e\u003cp\u003eCopy \u003ccode\u003ebuild\\offline-library\\\u003c/code\u003e to the card as above.\u003c/p\u003e\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eThe tool only reads from your server. It never changes watched status or playback positions there,\nand it prints only counts, never titles, addresses or tokens.\u003c/p\u003e\n\u003ch2 id=\"h-where-the-files-go-on-the-card\"\u003eWhere the files go on the card\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eOn the card\u003c/th\u003e\n\u003cth\u003eWhat it is\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/common/library.pjl\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe library (titles, rows, pictures)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/common/pack00.pjs\u003c/code\u003e ... \u003ccode\u003epack11.pjs\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe videos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/ChaoticSPARTAN1.Jellyfin/Jellyfin.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe list of files the Pocket loads for this core\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe Pocket loads only the packs listed in \u003ccode\u003eJellyfin.json\u003c/code\u003e, so always copy it together with the packs.\nOld pack files that the new list does not name are ignored and can be deleted to save space.\u003c/p\u003e\n\u003ch2 id=\"h-limits\"\u003eLimits\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eUp to \u003cstrong\u003e256 titles\u003c/strong\u003e and \u003cstrong\u003e12 packs\u003c/strong\u003e of up to \u003cstrong\u003e2 GiB\u003c/strong\u003e each (about 24 hours of video in total;\nabout 0.9 GB per hour).\u003c/li\u003e\n\u003cli\u003eOne video must fit in one pack (up to about 2 hours 15 minutes).\u003c/li\u003e\n\u003cli\u003eFrame rates: 23.976, 24, 25, 29.97 and 30 fps are kept as they are; 50 and 60 fps videos are halved.\u003c/li\u003e\n\u003cli\u003eSubtitles are not shown. One audio track is used (the one FFmpeg picks by default).\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-troubleshooting\"\u003eTroubleshooting\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProblem\u003c/th\u003e\n\u003cth\u003eWhat to do\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003effmpeg\u003c/code\u003e or \u003ccode\u003effprobe\u003c/code\u003e not found\u003c/td\u003e\n\u003ctd\u003eInstall FFmpeg and open a new terminal; \u003ccode\u003effmpeg -version\u003c/code\u003e must work\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eNo module named 'av'\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epy -3 -m pip install av\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Could not convert video N; skipped\"\u003c/td\u003e\n\u003ctd\u003eFFmpeg cannot read that file, or it has no video stream. Try playing it on the PC, or convert it to MP4 first\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Title exceeds a pack\"\u003c/td\u003e\n\u003ctd\u003eThe video is too long for one pack; split it into parts\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Pocket shows only the old titles\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eJellyfin.json\u003c/code\u003e was not copied, or the card was not ejected safely. Copy the whole \u003ccode\u003ebuild\\offline-library\\\u003c/code\u003e again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe core shows a black screen after copying\u003c/td\u003e\n\u003ctd\u003eSee \u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e; put back the files from your card backup\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting and recovery\u003c/a\u003e\u003c/p\u003e"
}
]

"path":"docs/Troubleshooting.md",
"title":"Troubleshooting and recovery",
"html":"\u003ch1 id=\"h-troubleshooting-and-recovery\"\u003eTroubleshooting and recovery\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Troubleshooting and recovery\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:golden-rules\"\u003eGolden rules\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:black-screen-with-a-flashing-backlight\"\u003eBlack screen with a flashing backlight\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:go-back-to-the-previous-files\"\u003eGo back to the previous files\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:other-problems\"\u003eOther problems\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:remove-the-core-cleanly\"\u003eRemove the core cleanly\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Troubleshooting.md:reporting-a-bug\"\u003eReporting a bug\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePocketFin runs only while you have the core open. It cannot change the Pocket's firmware, and quitting\nthe core or switching the Pocket off always returns it to normal.\u003c/p\u003e\n\u003ch2 id=\"h-golden-rules\"\u003eGolden rules\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eBack up the card\u003c/strong\u003e before installing or updating.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eNever edit \u003ccode\u003einteract.json\u003c/code\u003e\u003c/strong\u003e (or other files in \u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e). Changed\nversions of that file made the Pocket stop at a black screen during core start.\u003c/li\u003e\n\u003cli\u003eEject the card safely before taking it out of the computer.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-black-screen-with-a-flashing-backlight\"\u003eBlack screen with a flashing backlight\u003c/h2\u003e\n\u003cp\u003eIf the core stops at a black screen and the backlight flashes:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e\u003cstrong\u003eSwitch the Pocket off fully\u003c/strong\u003e: hold the power button until it turns off (about 10 seconds). A\nshort press may not be enough.\u003c/li\u003e\n\u003cli\u003eSwitch it on again. The Pocket starts normally; other cores are not affected.\u003c/li\u003e\n\u003cli\u003ePut back the PocketFin files you had before (next section), or reinstall \u003ccode\u003erelease/SD/\u003c/code\u003e from a\nfresh download. Check that \u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/interact.json\u003c/code\u003e is the file from the\nrelease (\u003ccode\u003erelease/SHA256SUMS.txt\u003c/code\u003e lists its checksum, which starts \u003ccode\u003e4b53bc27\u003c/code\u003e).\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"h-go-back-to-the-previous-files\"\u003eGo back to the previous files\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eFrom your own card backup: copy back \u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e,\n\u003ccode\u003eAssets/pocketlive/\u003c/code\u003e and \u003ccode\u003ePlatforms/pocketlive.json\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eIf you used \u003ccode\u003eInstall-PocketFin.ps1\u003c/code\u003e, the files it replaced are in \u003ccode\u003ebackups\\\u0026lt;date-time\u0026gt;\\\u003c/code\u003e next to the\nscript, in the same folder layout as the card. Copy them back onto the card.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-other-problems\"\u003eOther problems\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eWhat you see\u003c/th\u003e\n\u003cth\u003eWhat to do\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003cstrong\u003eJellyfin\u003c/strong\u003e is not in the core list\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/\u003c/code\u003e or \u003ccode\u003ePlatforms/pocketlive.json\u003c/code\u003e is missing; copy \u003ccode\u003erelease/SD/\u003c/code\u003e again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe start screen says the JPEG decoder failed\u003c/td\u003e\n\u003ctd\u003eThe bitstream is damaged or from another version: copy \u003ccode\u003erelease/SD/\u003c/code\u003e again\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Library on card: none\"\u003c/td\u003e\n\u003ctd\u003eCopy \u003ccode\u003erelease/SD-sample-library/\u003c/code\u003e or your own library (see \u003ca href=\"#docs/Offline-Library.md\"\u003eOffline library\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYour videos do not appear\u003c/td\u003e\n\u003ctd\u003eCopy the whole library folder again, including \u003ccode\u003eAssets/pocketlive/ChaoticSPARTAN1.Jellyfin/Jellyfin.json\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eResume points or the saved Chromatic library are lost\u003c/td\u003e\n\u003ctd\u003eQuit the core from the Pocket's menu instead of switching off; check \u003ccode\u003eSaves/pocketlive/common/\u003c/code\u003e has the \u003ccode\u003epjcache*.sav\u003c/code\u003e and \u003ccode\u003epjlive_log.sav\u003c/code\u003e files (from \u003ccode\u003erelease/SD-first-install-saves/\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eThe Chromatic is not found\u003c/td\u003e\n\u003ctd\u003eCable firmly in both ports; on the Chromatic choose \u003cstrong\u003ePocket link\u003c/strong\u003e; press \u003cstrong\u003eX\u003c/strong\u003e on the Pocket's start screen\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\"Link fault\" or titles do not start over the cable\u003c/td\u003e\n\u003ctd\u003eUnplug and replug the cable, choose Pocket link again. Try another link cable\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eYou cannot see what the Chromatic is doing while you hold the Pocket\u003c/td\u003e\n\u003ctd\u003eUse \u003ca href=\"https://github.com/ChaoticSPARTAN1/RemotePilot\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eRemote Pilot\u003c/a\u003e to watch the Chromatic's screen and log on your PC (\u003ca href=\"#docs/Wireless-Jellyfin.md:optional-remote-pilot\"\u003emore\u003c/a\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePlayback over the cable pauses\u003c/td\u003e\n\u003ctd\u003eNormal for the link's speed; copy the title to the card for smooth playback\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSound but no picture, or picture but no sound\u003c/td\u003e\n\u003ctd\u003eNote what the start screen says and report it (below)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-remove-the-core-cleanly\"\u003eRemove the core cleanly\u003c/h2\u003e\n\u003cp\u003eSee \u003ca href=\"#docs/Install.md:remove-pocketfin\"\u003eInstall \u0026gt; Remove PocketFin\u003c/a\u003e. Removing PocketFin leaves the rest of\nthe card untouched.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eThe app keeps a short log in \u003ccode\u003eSaves/pocketlive/common/pjlive_log.sav\u003c/code\u003e (written when you quit the core).\nIt is meant to hold timings and error messages only. Open an issue as described in\n\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e and attach the log if you can. Before posting anything, check it\ncontains no Wi-Fi names, server addresses or tokens (\u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/FAQ.md\"\u003eFAQ\u003c/a\u003e\u003c/p\u003e"
},

"path":"docs/FAQ.md",
"title":"FAQ",
"html":"\u003ch1 id=\"h-faq\"\u003eFAQ\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; FAQ\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/FAQ.md:basics\"\u003eBasics\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/FAQ.md:video-and-sound\"\u003eVideo and sound\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/FAQ.md:jellyfin-and-the-chromatic\"\u003eJellyfin and the Chromatic\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/FAQ.md:safety-and-legal\"\u003eSafety and legal\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-basics\"\u003eBasics\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is the core called \"Jellyfin\" on the Pocket and \"PocketFin\" here?\u003c/strong\u003e\nPocketFin is the project's name. The core keeps the name Jellyfin (folder \u003ccode\u003eChaoticSPARTAN1.Jellyfin\u003c/code\u003e)\nso existing libraries and saves on cards keep working.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDo I need a Chromatic?\u003c/strong\u003e No. Videos on the SD card play with nothing else. The Chromatic is only for\nlive access to your server.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it work in the Analogue Dock?\u003c/strong\u003e The core allows the Dock; it has not been tested much there.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I use the Pocket's Core Settings to change things?\u003c/strong\u003e Not yet. Those screens show leftover template\nlabels, which PocketFin ignores. See \u003ca href=\"#docs/Using-PocketFin.md:settings-in-the-pockets-menu\"\u003eUsing PocketFin\u003c/a\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-video-and-sound\"\u003eVideo and sound\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eWhy 256x144?\u003c/strong\u003e The FPGA decodes Motion-JPEG pictures in hardware. 256x144 at up to 30 fps keeps the\nfiles small (about 0.9 GB per hour) and the decoding smooth.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWill a 24 fps film play at 24 fps?\u003c/strong\u003e Yes. Each title keeps its own frame rate (23.976, 24, 25, 29.97 or\n30 fps). Press \u003cstrong\u003eR\u003c/strong\u003e while playing for film mode, which matches the screen refresh to the film.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSubtitles? Several audio languages?\u003c/strong\u003e Not yet. One audio track is used.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhy is streaming through the Chromatic blurry?\u003c/strong\u003e The link cable carries a few tens of kilobytes per\nsecond, so the server sends very small pictures. Copy titles to the card for the sharp version.\u003c/p\u003e\n\u003ch2 id=\"h-jellyfin-and-the-chromatic\"\u003eJellyfin and the Chromatic\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eDoes PocketFin need my Jellyfin password on the Pocket?\u003c/strong\u003e No. The Pocket never sees your server\naddress, password or tokens. The Chromatic signs in to your server (set up in Jellymatic), and the PC\ntool reads its own file on your PC.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDoes it change my server?\u003c/strong\u003e The PC tool only reads. Over the Chromatic, playback positions follow\nwhat Jellymatic does; see its documentation.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs there a Wi-Fi accessory or a direct PC connection?\u003c/strong\u003e No. The Pocket has no Wi-Fi, and cores cannot\nuse its USB port. The two supported ways are the Chromatic link and copying to the card.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eWhich Chromatic software do I need?\u003c/strong\u003e Jellymatic with its Pocket link option:\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/Jellymatic\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/ChaoticSPARTAN1/Jellymatic\u003c/a\u003e\u003c/p\u003e\n\u003ch2 id=\"h-safety-and-legal\"\u003eSafety and legal\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eCan PocketFin damage my Pocket?\u003c/strong\u003e It runs only while the core is open and does not touch the Pocket's\nfirmware. The worst known case is a black screen at core start if core files are edited; switching the\nPocket off fully and restoring the files fixes it (\u003ca href=\"#docs/Troubleshooting.md\"\u003eTroubleshooting\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs this made by Analogue or Jellyfin?\u003c/strong\u003e No. PocketFin is an independent project, not affiliated with\nAnalogue or the Jellyfin project.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCan I share converted videos?\u003c/strong\u003e Only if you have the right to. Only convert videos you own or may copy.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eIs support guaranteed?\u003c/strong\u003e No. Bug reports and pull requests are welcome, but answers are not\nguaranteed (\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Building-from-Source.md\"\u003eBuilding from source\u003c/a\u003e\u003c/p\u003e"
}
]
