"title":"Building from source",
"html":"\u003ch1 id=\"h-building-from-source\"\u003eBuilding from source\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Building from source\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:what-is-in-the-repository\"\u003eWhat is in the repository\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:tools\"\u003eTools\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:1-fetch-the-upstream-sources\"\u003e1. Fetch the upstream sources\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:2-build-the-app\"\u003e2. Build the app\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:3-build-the-fpga-core\"\u003e3. Build the FPGA core\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:4-make-the-release\"\u003e4. Make the release\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:5-run-the-tests\"\u003e5. Run the tests\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Building-from-Source.md:offline-documentation-page\"\u003eOffline documentation page\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYou do not need any of this to use PocketFin: \u003ccode\u003erelease/\u003c/code\u003e is ready to copy. These steps rebuild every\nfile in it from source.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-the-repository\"\u003eWhat is in the repository\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFolder\u003c/th\u003e\n\u003cth\u003eContents\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epocket/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe app (C): screens, library reader, playback, link-cable client, and PC test programs (\u003ccode\u003echeck_*.c\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eshared/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eHeaders shared with Jellymatic: wire framing, the request protocol, the A/V stream format\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ertl/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003ePocketFin's FPGA blocks (link-cable byte engine, JPEG register interface, FIFOs) and their test benches\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecore/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003eexpected-sources.json\u003c/code\u003e (the core's checked source list) and \u003ccode\u003egenerated/\u003c/code\u003e (the CPU, boot ROM and kernel the release was built with)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003etools/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eBuild, packaging, library and test scripts (Python and PowerShell)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ethird_party/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe Jellyfin logo files (CC BY-SA 4.0)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003erelease/\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe ready-to-copy SD card files\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eBig upstream projects are not copied in. \u003ccode\u003etools/fetch_upstreams.py\u003c/code\u003e fetches them at the exact\nrevisions in \u003ccode\u003eupstream.lock.json\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-tools\"\u003eTools\u003c/h2\u003e\n\u003cp\u003eWindows 10/11 is assumed. Paths can be changed with environment variables (see \u003ccode\u003etools/toolpaths.py\u003c/code\u003e).\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eTool\u003c/th\u003e\n\u003cth\u003eNeeded for\u003c/th\u003e\n\u003cth\u003eWhere it is looked for\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eGit, Python 3.12+\u003c/td\u003e\n\u003ctd\u003eeverything\u003c/td\u003e\n\u003ctd\u003ePATH (\u003ccode\u003epy -3\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRISC-V GCC 15.1 (\u003ccode\u003eriscv64-unknown-elf-gcc\u003c/code\u003e, MSYS2 UCRT64 packages listed in \u003ccode\u003eupstream.lock.json\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003ethe app, the kernel\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOCKETFIN_RISCV_BIN\u003c/code\u003e (default \u003ccode\u003elocal-tools\\riscv\\ucrt64\\bin\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eMSYS2 (gcc, make, bash, libjpeg)\u003c/td\u003e\n\u003ctd\u003ePC tests, kernel build\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOCKETFIN_MSYS\u003c/code\u003e (default \u003ccode\u003eC:\\msys64\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIntel Quartus Prime Lite 21.1.1 (free)\u003c/td\u003e\n\u003ctd\u003ethe FPGA core\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOCKETFIN_QUARTUS\u003c/code\u003e (default \u003ccode\u003eC:\\intelFPGA_lite\\21.1\\quartus\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIcarus Verilog 13\u003c/td\u003e\n\u003ctd\u003eRTL tests\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOCKETFIN_IVERILOG\u003c/code\u003e (folder with \u003ccode\u003ebin\\iverilog.exe\u003c/code\u003e)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eFFmpeg 7+ and PyAV\u003c/td\u003e\n\u003ctd\u003edemo library, offline library, logo images\u003c/td\u003e\n\u003ctd\u003ePATH; \u003ccode\u003epy -3 -m pip install av\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003efontTools\u003c/td\u003e\n\u003ctd\u003eonly to regenerate the font atlas\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003epy -3 -m pip install fonttools\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJava 17 + sbt (downloaded by the script)\u003c/td\u003e\n\u003ctd\u003eonly to regenerate the CPU\u003c/td\u003e\n\u003ctd\u003e\u003ccode\u003ePOCKETFIN_JAVA_HOME\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-1-fetch-the-upstream-sources\"\u003e1. Fetch the upstream sources\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\fetch_upstreams.py          # openfpgaSDK, openfpgaCore, core_jpeg into upstream\\\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-2-build-the-app\"\u003e2. Build the app\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003e.\\tools\\Build-LivePlayer.ps1            # -\u0026gt; build\\pocket-live-player\\pjlive.elf\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eWith the pinned compiler the result is byte-identical to the released app (SHA-256 starts\n\u003ccode\u003ee8ed291c\u003c/code\u003e, see \u003ccode\u003erelease/SHA256SUMS.txt\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003eThe app's font is generated from Google's Roboto font. To regenerate it (optional; needs fontTools,\n\u003ccode\u003epy -3 -m pip install fonttools\u003c/code\u003e):\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\fetch_upstreams.py --font   # Roboto 2.138, checked by SHA-256 -\u0026gt; upstream\\roboto\\\npy -3 tools\\build_roboto_atlas.py       # -\u0026gt; pocket\\fonts\\roboto-medium-18.a8 and .json\npy -3 tools\\build_ui_font.py            # -\u0026gt; pocket\\ui_font.h and pocket\\ui_font_large.h\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-3-build-the-fpga-core\"\u003e3. Build the FPGA core\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\prepare_pocket_media_core.py    # pinned openfpgaCore + PocketFin's changes -\u0026gt; build\\pocket-media-core\n.\\tools\\Build-PocketMediaCore.ps1 -Fit      # Quartus: 20-60 minutes -\u0026gt; ap_core.rbf\n.\\tools\\Audit-PocketMediaCore.ps1           # checks timing of the clock-crossing paths\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eprepare_pocket_media_core.py\u003c/code\u003e applies every change with exact-text checks, then compares the 43\nfiles PocketFin adds or changes with \u003ccode\u003ecore/expected-sources.json\u003c/code\u003e (the tree the released bitstream was\nbuilt from; PocketFin's own RTL files have since changed in comments only). What PocketFin changes in\nthe runtime:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethe 33-bit link block is replaced by \u003ccode\u003epocket_media_accel\u003c/code\u003e (byte link + JPEG decoder) on a 90 MHz CPU\nclock; the JPEG decoder runs on the existing 24.576 MHz clock;\u003c/li\u003e\n\u003cli\u003ethe register window grows by one address bit; the hardware/kernel contract number becomes\n\u003ccode\u003e0x504a0001\u003c/code\u003e, and the old link and network drivers stand down on this core;\u003c/li\u003e\n\u003cli\u003ean upstream AXI write-address bug is fixed (the first delayed write beat was advanced by 4 bytes);\u003c/li\u003e\n\u003cli\u003ethe save fix in \u003ccode\u003ecore_bridge_cmd.v\u003c/code\u003e keeps save-slot entries when the Pocket resets the core at quit\n(\u003ccode\u003etools/pocket_save_exit_patch.py\u003c/code\u003e);\u003c/li\u003e\n\u003cli\u003ea smaller single-issue CPU configuration (16 KiB / 64 KiB caches) and fitter seed 9.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eThe CPU (\u003ccode\u003eVexiiRiscv_media.v\u003c/code\u003e), boot ROM (\u003ccode\u003efirmware.mif\u003c/code\u003e) and kernel (\u003ccode\u003eos.bin\u003c/code\u003e) come from\n\u003ccode\u003ecore/generated/\u003c/code\u003e. To rebuild them as well: \u003ccode\u003etools\\fetch_upstreams.py --cpu\u003c/code\u003e,\n\u003ccode\u003eprepare_pocket_media_core.py --cpu-sources\u003c/code\u003e, \u003ccode\u003etools\\Build-MediaCPU.ps1\u003c/code\u003e, \u003ccode\u003etools\\Build-MediaFirmware.ps1\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"h-4-make-the-release\"\u003e4. Make the release\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\build_brand_assets.py       # Jellyfin logo -\u0026gt; core icon and platform image (build\\brand)\npy -3 tools\\build_sample_library.py     # 20-second generated test pattern (build\\sample-library)\npy -3 tools\\package_release.py          # -\u0026gt; release\\SD, SD-sample-library, SD-first-install-saves, SHA256SUMS.txt\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003epackage_release.py\u003c/code\u003e uses your own \u003ccode\u003eap_core.rbf\u003c/code\u003e if you built one, otherwise the released bitstream.\nIt refuses an \u003ccode\u003einteract.json\u003c/code\u003e other than the proven SDK template and checks the save-slot layout and\nthe Chip32 loader.\u003c/p\u003e\n\u003ch2 id=\"h-5-run-the-tests\"\u003e5. Run the tests\u003c/h2\u003e\n\u003cp\u003eAll tests run on the PC; none touch a Pocket or a card.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\test_pocket_loader.py       # the loader writes saves back at quit\npy -3 tools\\test_link_gateway.py        # request/reply protocol, no secrets in replies\npy -3 tools\\test_stream_worker.py       # streaming worker\npy -3 tools\\test_av_stream.py           # A/V stream format\npy -3 tools\\test_live_av.py             # encoder (FFmpeg + PyAV)\npy -3 tools\\test_sd_library.py          # on-card library end to end through the C reader\npy -3 tools\\test_native_client.py       # the app's controller and screens; writes build\\native-client\\ui-*.png\npy -3 tools\\test_pocket_save_exit.py    # the save fix on the real bridge RTL (Icarus; Quartus sim library optional)\npy -3 tools\\test_rtl.py                 # link byte engine, FIFOs, JPEG decoder on the app's self-test frame (Icarus)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003etest_sd_library.py\u003c/code\u003e needs \u003ccode\u003ebuild\\sample-library\u003c/code\u003e (step 4). \u003ccode\u003etest_pocket_save_exit.py\u003c/code\u003e and\n\u003ccode\u003etest_rtl.py\u003c/code\u003e need \u003ccode\u003ebuild\\pocket-media-core\u003c/code\u003e (step 3, prepare only).\u003c/p\u003e\n\u003ch2 id=\"h-offline-documentation-page\"\u003eOffline documentation page\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eOpen-Documentation.html\u003c/code\u003e in the main folder holds every documentation page in one file that opens by\ndouble-click, with no server and no internet connection. \u003cstrong\u003eAfter editing any \u003ccode\u003e.md\u003c/code\u003e page, rebuild it:\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\build_docs_html.py          # rewrites Open-Documentation.html\npy -3 tools\\test_docs_html.py           # fails if it is out of date or would load anything from the internet\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIt needs only Python (no packages). It converts README, \u003ccode\u003edocs\\*.md\u003c/code\u003e, CONTRIBUTING, SECURITY,\nTHIRD-PARTY-NOTICES and ADDITIONAL-TERMS (only files tracked by Git) and stores them inside the page;\npictures load from \u003ccode\u003edocs\\images\\\u003c/code\u003e. A new page in \u003ccode\u003edocs\\\u003c/code\u003e appears under \u003cstrong\u003eMore\u003c/strong\u003e until you add it to a\ngroup in \u003ccode\u003eGROUPS\u003c/code\u003e at the top of the script. The README's banner and dividers are pictures in\n\u003ccode\u003edocs\\images\\readme\\\u003c/code\u003e (dark and light versions), because GitHub does not show page styles. The same run\nwrites \u003ccode\u003edocs\\index.html\u003c/code\u003e, a copy for GitHub Pages (see below).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe PDF guide\u003c/strong\u003e (\u003ccode\u003edocs\\PocketFin-Guide.pdf\u003c/code\u003e, shown by GitHub in the browser) is printed from the same\npages by Chrome or Edge, offline:\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-powershell\"\u003epy -3 tools\\build_docs_pdf.py           # rewrites docs\\PocketFin-Guide.pdf and docs\\.guide-source.sha256\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe test above says when the PDF is out of date (it compares \u003ccode\u003edocs\\.guide-source.sha256\u003c/code\u003e with the pages\nand build scripts; it does not print again). Set \u003ccode\u003eDOCS_BROWSER\u003c/code\u003e if Chrome or Edge is not found.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eFor maintainers, when the repository is public:\u003c/strong\u003e GitHub can host the documentation for free. In the\nrepository's Settings \u0026gt; Pages, choose Deploy from a branch, branch \u003ccode\u003emain\u003c/code\u003e, folder \u003ccode\u003e/docs\u003c/code\u003e. The site is then\n\u003ccode\u003ehttps://chaoticspartan1.github.io/PocketFin/\u003c/code\u003e (it serves \u003ccode\u003edocs\\index.html\u003c/code\u003e; \u003ccode\u003edocs\\.nojekyll\u003c/code\u003e makes GitHub\nserve the files as they are). Add a link to it in the README only once it works.\u003c/p\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/AI-Prompt-Examples.md\"\u003eAI prompt examples\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/AI-Prompt-Examples.md",
"title":"AI prompt examples",
"html":"\u003ch1 id=\"h-ai-prompt-examples\"\u003eAI prompt examples\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; AI prompt examples\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md:safety-rules-to-include\"\u003eSafety rules to include\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md:building\"\u003eBuilding\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md:troubleshooting\"\u003eTroubleshooting\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md:adding-features\"\u003eAdding features\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/AI-Prompt-Examples.md:reviewing-a-change\"\u003eReviewing a change\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eYou can use an AI coding assistant (for example Claude Code, OpenAI Codex or another assistant) to\nbuild, debug or extend PocketFin. Paste one of these prompts into the assistant while it is working in\nyour copy of this repository. Check what it does; you are responsible for what ends up on your card.\u003c/p\u003e\n\u003ch2 id=\"h-safety-rules-to-include\"\u003eSafety rules to include\u003c/h2\u003e\n\u003cp\u003eAdd this block to any prompt (or to the assistant's project instructions file):\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eRules for this repository:\n- Work on the PC only. Do not write to an SD card, a Pocket, a Chromatic or any device unless I say so\n  in this conversation, and never change console firmware.\n- Never read, print or copy private/ (my Jellyfin sign-in) or anything with Wi-Fi names, passwords,\n  tokens or server addresses. Do not put secrets on command lines or in logs.\n- Never edit release/SD/Cores/ChaoticSPARTAN1.Jellyfin/interact.json. Other versions hung the Pocket.\n- Keep the attribution \"ChaoticSPARTAN1\" in credits and the About screen (ADDITIONAL-TERMS.md).\n- Do not add third-party videos, images or code unless their licence allows it; say which licence.\n- Run the tests in docs/Building-from-Source.md after changes and tell me which passed or failed.\n- Do not push, publish or create repositories unless I ask.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-building\"\u003eBuilding\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eRead docs/Building-from-Source.md. Fetch the upstream sources, build the app with\ntools/Build-LivePlayer.ps1 and tell me whether pjlive.elf matches the SHA-256 in release/SHA256SUMS.txt.\nIf a tool is missing, tell me exactly what to install and where; do not install anything without asking.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003ePrepare the FPGA core tree with tools/prepare_pocket_media_core.py and run a Quartus map (no fit) with\ntools/Build-PocketMediaCore.ps1. Summarise errors and warnings that concern files under rtl/.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-troubleshooting\"\u003eTroubleshooting\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eMy Pocket shows a black screen with a flashing backlight when I start the Jellyfin core. I already\nswitched it off fully. Here is the list of files in Cores/ChaoticSPARTAN1.Jellyfin on my card with their\nSHA-256 values: \u0026lt;paste\u0026gt;. Compare them with release/SHA256SUMS.txt and tell me which files to restore.\nDo not suggest editing interact.json.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003etools/make_offline_library.py fails with this message: \u0026lt;paste, with any paths or names removed\u0026gt;.\nFind the cause in the code and suggest a fix. Test it with a video generated by FFmpeg\n(testsrc2 + sine), not with my own files.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-adding-features\"\u003eAdding features\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eI want subtitles for videos on the SD card. Read pocket/sd_library.h, tools/pocket_library.py and\ntools/live_av.py. Propose a design that keeps the existing library format readable (version it), list\nthe files to change, then implement it with a PC test in pocket/check_sd_library.c. Keep frame timing\nand audio unchanged. Do not touch the FPGA core.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eAdd a Settings screen to the app for buffer length and volume, using the existing values in\npocket/core_settings.h. Draw it in the same style as live_ui.h. Add a case to\npocket/check_live_controller.c and render a preview with tools/test_native_client.py. Show me the\npreview image.\n\u003c/code\u003e\u003c/pre\u003e\n\u003ch2 id=\"h-reviewing-a-change\"\u003eReviewing a change\u003c/h2\u003e\n\u003cpre\u003e\u003ccode class=\"language-text\"\u003eReview my uncommitted changes for bugs. Focus on buffer sizes, integer overflow, timing on the\nPocket's 90 MHz CPU and anything that could stop saves being written at quit. Run the tests and report\nresults. Do not make changes; list findings with file and line.\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNext: \u003ca href=\"#docs/Credits-and-Licences.md\"\u003eCredits and licences\u003c/a\u003e\u003c/p\u003e"
},
{
"path":"docs/Credits-and-Licences.md",
"title":"Credits and licences",
"html":"\u003ch1 id=\"h-credits-and-licences\"\u003eCredits and licences\u003c/h1\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eHome\u003c/a\u003e \u0026gt; Credits and licences\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ca href=\"#docs/Credits-and-Licences.md:credits\"\u003eCredits\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Credits-and-Licences.md:licence\"\u003eLicence\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Credits-and-Licences.md:third-party-parts\"\u003eThird-party parts\u003c/a\u003e\u003c/li\u003e\n\u003cli\u003e\u003ca href=\"#docs/Credits-and-Licences.md:trademarks\"\u003eTrademarks\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"h-credits\"\u003eCredits\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003ePocketFin was created by ChaoticSPARTAN1.\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eIt builds on the work of:\u003c/p\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eProject\u003c/th\u003e\n\u003cth\u003eBy\u003c/th\u003e\n\u003cth\u003eUsed for\u003c/th\u003e\n\u003cth\u003eLicence\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eopenfpgaOS runtime and SDK\u003c/td\u003e\n\u003ctd\u003eThinkElastic\u003c/td\u003e\n\u003ctd\u003ethe FPGA system, OS kernel, app start-up code, templates\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ecore_jpeg\u003c/td\u003e\n\u003ctd\u003eUltra-Embedded.com\u003c/td\u003e\n\u003ctd\u003ethe hardware JPEG decoder\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eVexiiRiscv / SpinalHDL\u003c/td\u003e\n\u003ctd\u003eSpinalHDL\u003c/td\u003e\n\u003ctd\u003ethe RISC-V CPU\u003c/td\u003e\n\u003ctd\u003eMIT (generated RTL)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eRoboto font\u003c/td\u003e\n\u003ctd\u003eGoogle\u003c/td\u003e\n\u003ctd\u003ethe app's text (glyph atlas generated by \u003ccode\u003etools/build_roboto_atlas.py\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eJellyfin logo\u003c/td\u003e\n\u003ctd\u003ethe Jellyfin contributors\u003c/td\u003e\n\u003ctd\u003ethe logo in the app, core icon and platform image\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAnalogue Pocket Framework\u003c/td\u003e\n\u003ctd\u003eAnalogue\u003c/td\u003e\n\u003ctd\u003ethe Pocket's core framework inside the bitstream\u003c/td\u003e\n\u003ctd\u003eAnalogue APF licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eIntel megafunctions\u003c/td\u003e\n\u003ctd\u003eIntel\u003c/td\u003e\n\u003ctd\u003ePLLs and memories inside the bitstream\u003c/td\u003e\n\u003ctd\u003eIntel FPGA IP licence\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003emusl libc\u003c/td\u003e\n\u003ctd\u003eRich Felker, et al. (the musl contributors)\u003c/td\u003e\n\u003ctd\u003eC library in the app and kernel\u003c/td\u003e\n\u003ctd\u003eMIT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ecram0_phy\u003c/td\u003e\n\u003ctd\u003eAdam Gastineau\u003c/td\u003e\n\u003ctd\u003ememory interface inside the bitstream\u003c/td\u003e\n\u003ctd\u003eMIT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edlmalloc, lib9660\u003c/td\u003e\n\u003ctd\u003eDoug Lea; Erin Shepherd\u003c/td\u003e\n\u003ctd\u003ememory allocator and ISO reader in the kernel\u003c/td\u003e\n\u003ctd\u003eMIT-0; ISC\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eThe app's About screen on the Pocket lists the main credits; the full list is in the notices on the card.\u003c/p\u003e\n\u003ch2 id=\"h-licence\"\u003eLicence\u003c/h2\u003e\n\u003cp\u003ePocketFin's own code and files are licensed under the \u003cstrong\u003eGNU General Public License, version 3 or\nlater\u003c/strong\u003e (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e), with additional terms and one additional permission under section 7\n(\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e):\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003eAttribution (7(b))\u003c/strong\u003e: keep \"ChaoticSPARTAN1\" in the credits and in any About or credits screen.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eOrigin (7(c))\u003c/strong\u003e: do not remove that attribution or present the work as if it had no original\nauthor.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eBitstream permission\u003c/strong\u003e: you may convey the FPGA bitstream, which combines PocketFin with the\nAnalogue Pocket Framework and Intel/Altera FPGA IP generated by Quartus; its Corresponding Source\nneed not include the source of those parts, which keep their own licences.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eContributions are accepted under the same licence, additional terms and permission\n(\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e). PocketFin's patches to openfpgaCore's Apache-2.0 files\nare Apache-2.0, like the files they change.\u003c/p\u003e\n\u003ch2 id=\"h-third-party-parts\"\u003eThird-party parts\u003c/h2\u003e\n\u003cp\u003eEvery bundled or derived component, what it is in, and why it may be shipped:\n\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e. Licence texts, with each component's own\ncopyright lines, and the openfpgaOS NOTICE files: \u003ca href=\"LICENSES\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/\u003c/a\u003e. On the card the same\nnotices are in \u003ccode\u003eNotices/PocketLive/\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe demo video is generated by this project (FFmpeg's test-pattern and tone generators); it contains\nno third-party footage or music. The openfpgaOS SDK's sample sound bank and music modules are not used.\u003c/p\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eAnalogue and Analogue Pocket are trademarks of Analogue Enterprises Limited. Jellyfin is a trademark of\nits owners. ModRetro and Chromatic are trademarks of ModRetro, Inc. PocketFin is an independent project,\nnot affiliated with, endorsed by or supported by any of them.\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"#docs/Home.md\"\u003eBack to Home\u003c/a\u003e\u003c/p\u003e"
},

"path":"CONTRIBUTING.md",
"title":"Contributing",
"html":"\u003ch1 id=\"h-contributing-to-pocketfin\"\u003eContributing to PocketFin\u003c/h1\u003e\n\u003cp\u003eThank you for helping. Bug reports, bug fixes, documentation fixes and pull requests are welcome.\nPocketFin is a hobby project: there is no guarantee of a response or a fix, or of when.\u003c/p\u003e\n\u003ch2 id=\"h-reporting-a-bug\"\u003eReporting a bug\u003c/h2\u003e\n\u003cp\u003eOpen an issue on GitHub with:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ewhat you did, what you expected and what happened;\u003c/li\u003e\n\u003cli\u003ethe PocketFin version (core.json, or the release you downloaded) and your Pocket firmware version;\u003c/li\u003e\n\u003cli\u003ewhether you used the card on its own or a Chromatic (and its Jellymatic version);\u003c/li\u003e\n\u003cli\u003ewhat the start screen shows (the self-test lines);\u003c/li\u003e\n\u003cli\u003eif you can, \u003ccode\u003eSaves/pocketlive/common/pjlive_log.sav\u003c/code\u003e from your card.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eNever post\u003c/strong\u003e Wi-Fi network names or passwords, server addresses, user names, API keys or tokens,\nor logs and screenshots that show them. Remove them first. Do not post copyrighted videos.\nSecurity problems: see \u003ca href=\"#SECURITY.md\"\u003eSECURITY.md\u003c/a\u003e, not a public issue.\u003c/p\u003e\n\u003ch2 id=\"h-pull-requests\"\u003ePull requests\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003eKeep changes small and focused, with a short description of why.\u003c/li\u003e\n\u003cli\u003eRun the tests in \u003ca href=\"#docs/Building-from-Source.md:5-run-the-tests\"\u003edocs/Building-from-Source.md\u003c/a\u003e and\nsay which you ran.\u003c/li\u003e\n\u003cli\u003eDo not change \u003ccode\u003erelease/\u003c/code\u003e in the same pull request as source changes unless you rebuilt it with\n\u003ccode\u003etools/package_release.py\u003c/code\u003e; say so if you did.\u003c/li\u003e\n\u003cli\u003eNever change \u003ccode\u003einteract.json\u003c/code\u003e in the release without a tested reason: other versions hung the Pocket.\u003c/li\u003e\n\u003cli\u003eNew third-party code or assets must have a licence compatible with GPL-3.0-or-later; add them to\n\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eKeep the \"ChaoticSPARTAN1\" attribution (see \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eNew source files start with \u003ccode\u003eSPDX-License-Identifier: GPL-3.0-or-later\u003c/code\u003e and the line\n\u003ccode\u003eAdditional terms and permissions: ADDITIONAL-TERMS.md\u003c/code\u003e, like the existing ones.\u003c/li\u003e\n\u003cli\u003eAfter editing any documentation page, run \u003ccode\u003epy -3 tools\\build_docs_html.py\u003c/code\u003e (Open-Documentation.html\nand docs/index.html) and \u003ccode\u003epy -3 tools\\build_docs_pdf.py\u003c/code\u003e (the PDF guide); \u003ccode\u003etools\\test_docs_html.py\u003c/code\u003e\nchecks all three. When the repository is public, GitHub Pages can serve the docs: Settings \u0026gt; Pages,\nbranch \u003ccode\u003emain\u003c/code\u003e, folder \u003ccode\u003e/docs\u003c/code\u003e; the site is \u003ccode\u003ehttps://chaoticspartan1.github.io/PocketFin/\u003c/code\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eBy contributing you agree that your contribution is accepted under the same licence\n(GPL-3.0-or-later), with the same additional terms and the same additional permission as the rest of\nPocketFin (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e). Changes to third-party files keep that\nfile's own licence (for example, patches to openfpgaCore's Apache-2.0 files are Apache-2.0).\u003c/p\u003e"
},
{
"path":"SECURITY.md",
"title":"Security",
"html":"\u003ch1 id=\"h-security\"\u003eSecurity\u003c/h1\u003e\n\u003ch2 id=\"h-reporting-a-vulnerability\"\u003eReporting a vulnerability\u003c/h2\u003e\n\u003cp\u003ePlease report security problems \u003cstrong\u003eprivately\u003c/strong\u003e, not in a public issue: use GitHub's \u003cstrong\u003eReport a\nvulnerability\u003c/strong\u003e button on the repository's \u003cstrong\u003eSecurity\u003c/strong\u003e tab (private vulnerability reporting).\nDescribe the problem and how to reproduce it. There is no guarantee of a response time.\u003c/p\u003e\n\u003cp\u003eExamples: a way for data on the link cable or in a library file to crash the app or run code, a tool\nthat leaks a token or address, or a file that could harm a card.\u003c/p\u003e\n\u003ch2 id=\"h-never-post-publicly\"\u003eNever post publicly\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eWi-Fi network names (SSIDs) or passwords\u003c/li\u003e\n\u003cli\u003eJellyfin server addresses, user names, user or item IDs\u003c/li\u003e\n\u003cli\u003epasswords, API keys, access tokens or Quick Connect codes\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eprivate/jellyfin-connection.txt\u003c/code\u003e or any file from \u003ccode\u003eprivate/\u003c/code\u003e\u003c/li\u003e\n\u003cli\u003elogs, screenshots or photos that show any of the above\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003eIf you posted one by mistake, change the password or revoke the token in Jellyfin first, then edit the\npost.\u003c/p\u003e\n\u003ch2 id=\"h-what-pocketfin-keeps-where\"\u003eWhat PocketFin keeps where\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eThe Pocket never receives your server address or sign-in. Library files on the card hold titles,\ndescriptions, pictures and video only.\u003c/li\u003e\n\u003cli\u003eThe PC tools read your sign-in only from \u003ccode\u003eprivate/jellyfin-connection.txt\u003c/code\u003e on your PC (Git ignores the\nfolder), never print it, and only read from your server.\u003c/li\u003e\n\u003cli\u003eThe Chromatic side (Jellymatic) keeps its own settings on the Chromatic; see its documentation.\u003c/li\u003e\n\u003c/ul\u003e"
},
{
"path":"THIRD-PARTY-NOTICES.md",
"title":"Third-party notices",
"html":"\u003ch1 id=\"h-third-party-notices\"\u003eThird-party notices\u003c/h1\u003e\n\u003cp\u003ePocketFin's own code is GPL-3.0-or-later with additional terms and an additional permission for the\nFPGA bitstream (\u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e, \u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e). It is built with,\nand its release files contain, the parts below. Each keeps its own licence. The licence and notice\nfiles named below are in \u003ca href=\"LICENSES\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSES/\u003c/a\u003e in the source repository and, with the same file\nnames, in \u003ccode\u003eNotices/PocketLive/\u003c/code\u003e on the SD card.\u003c/p\u003e\n\u003cp\u003eFile paths such as \u003ccode\u003etools/...\u003c/code\u003e or \u003ccode\u003epocket/...\u003c/code\u003e refer to the source repository,\n\u003ca href=\"https://github.com/ChaoticSPARTAN1/PocketFin\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/ChaoticSPARTAN1/PocketFin\u003c/a\u003e . Paths starting with \u003ccode\u003eCores/\u003c/code\u003e, \u003ccode\u003eAssets/\u003c/code\u003e, \u003ccode\u003ePlatforms/\u003c/code\u003e\nor \u003ccode\u003eNotices/\u003c/code\u003e are on the SD card.\u003c/p\u003e\n\u003ch2 id=\"h-what-is-in-each-release-file\"\u003eWhat is in each release file\u003c/h2\u003e\n\u003cdiv class=\"table\"\u003e\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eRelease file\u003c/th\u003e\n\u003cth\u003eWhat it contains\u003c/th\u003e\n\u003cth\u003eLicences\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCores/ChaoticSPARTAN1.Jellyfin/os25.rbf_r\u003c/code\u003e (FPGA bitstream)\u003c/td\u003e\n\u003ctd\u003eopenfpgaCore runtime RTL; PocketFin RTL (byte link, JPEG glue, FIFOs); core_jpeg decoder; VexiiRiscv CPU (generated); Analogue Pocket Framework files; Intel/Altera megafunction IP and Quartus library modules (PLLs, RAMs, DDIO); cram0_phy\u003c/td\u003e\n\u003ctd\u003eApache-2.0; GPL-3.0-or-later with the bitstream permission; Apache-2.0; MIT; Analogue APF licence; Intel FPGA IP licence; MIT\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/common/os.bin\u003c/code\u003e (OS kernel) and the boot ROM inside the bitstream\u003c/td\u003e\n\u003ctd\u003eopenfpgaCore firmware with PocketFin's small patches (Apache-2.0, see below); musl libc; dlmalloc; lib9660\u003c/td\u003e\n\u003ctd\u003eApache-2.0; MIT; MIT-0; ISC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/common/pjlive.elf\u003c/code\u003e (the app)\u003c/td\u003e\n\u003ctd\u003ePocketFin app; Roboto Medium font atlas; Jellyfin logo; openfpgaOS SDK start-up code and headers; musl libc; libgcc\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later; Apache-2.0; CC BY-SA 4.0; Apache-2.0; MIT; GPL-3.0 with GCC Runtime Library Exception\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCores/.../loader.bin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eopenfpgaOS SDK Chip32 loader with a short added tail (\u003ccode\u003etools/pocket_loader.py\u003c/code\u003e)\u003c/td\u003e\n\u003ctd\u003eApache-2.0 (SDK part)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCores/.../*.json\u003c/code\u003e, \u003ccode\u003ePlatforms/pocketlive.json\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eopenfpgaOS SDK templates, edited\u003c/td\u003e\n\u003ctd\u003eApache-2.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eCores/.../icon.bin\u003c/code\u003e, \u003ccode\u003ePlatforms/_images/pocketlive.bin\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eJellyfin logo, scaled and converted to the Pocket's gray format\u003c/td\u003e\n\u003ctd\u003eCC BY-SA 4.0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eAssets/pocketlive/common/library.pjl\u003c/code\u003e, \u003ccode\u003epack00.pjs\u003c/code\u003e (demo)\u003c/td\u003e\n\u003ctd\u003eA test pattern and tone generated by FFmpeg's \u003ccode\u003etestsrc2\u003c/code\u003e and \u003ccode\u003esine\u003c/code\u003e sources; no third-party footage or sound\u003c/td\u003e\n\u003ctd\u003eGPL-3.0-or-later (generated by this project)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\u003c/div\u003e\n\u003ch2 id=\"h-components\"\u003eComponents\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eopenfpgaOS SDK\u003c/strong\u003e - \u003ca href=\"https://github.com/openfpgaOS/openfpgaSDK\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/openfpgaOS/openfpgaSDK\u003c/a\u003e (commit a408ddc).\nCopyright (c) 2026 ThinkElastic. Apache-2.0 (\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApache-2.0.txt\u003c/a\u003e); its NOTICE\nfile is \u003ca href=\"LICENSES/openfpgaSDK-NOTICE.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eopenfpgaSDK-NOTICE.txt\u003c/a\u003e. musl libc inside it: see below.\nThe SDK also contains a SoundFont and tracker modules of unclear provenance (its\n\u003ccode\u003eLicenseRef-Proprietary-SampleData\u003c/code\u003e and \u003ccode\u003eLicenseRef-ThirdParty-Media\u003c/code\u003e); PocketFin does \u003cstrong\u003enot\u003c/strong\u003e use\nor ship any of them.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eopenfpgaCore\u003c/strong\u003e - \u003ca href=\"https://github.com/openfpgaOS/openfpgaCore\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/openfpgaOS/openfpgaCore\u003c/a\u003e (commit 618a3eb). Copyright (c)\n2026 ThinkElastic. Apache-2.0 for its own files (\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApache-2.0.txt\u003c/a\u003e); its\nNOTICE file is \u003ca href=\"LICENSES/openfpgaCore-NOTICE.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eopenfpgaCore-NOTICE.txt\u003c/a\u003e. PocketFin does not\ninclude this source; it is fetched by \u003ccode\u003etools/fetch_upstreams.py\u003c/code\u003e and patched by\n\u003ccode\u003etools/prepare_pocket_media_core.py\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003ePocketFin's changes to openfpgaCore's Apache-2.0 files (the patch hunks applied to\n\u003ccode\u003esrc/firmware/os/hal/link.c\u003c/code\u003e, \u003ccode\u003esrc/firmware/os/hal/net.c\u003c/code\u003e, \u003ccode\u003esrc/firmware/os/hal/regs.h\u003c/code\u003e and\n\u003ccode\u003esrc/fpga/common/axi_periph_slave.v\u003c/code\u003e by \u003ccode\u003etools/prepare_pocket_media_core.py\u003c/code\u003e) are contributed under\nthe Apache License, Version 2.0, so those patched files, and the kernel and boot ROM built from\nthem, stay under Apache-2.0. The rest of that script is GPL-3.0-or-later like the rest of PocketFin.\u003c/p\u003e\n\u003cp\u003eThe bitstream built from openfpgaCore also contains:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003ethe \u003cstrong\u003eAnalogue Pocket Framework\u003c/strong\u003e (\u003ccode\u003eapf/\u003c/code\u003e, \u003ccode\u003ecore_top.v\u003c/code\u003e, \u003ccode\u003ecore_bridge_cmd.v\u003c/code\u003e, \u003ccode\u003eio_sdram.v\u003c/code\u003e),\nCopyright (c) Analogue Enterprises Limited, under the Analogue Pocket Framework Software\nLicense Agreement (\u003ca href=\"LICENSES/LicenseRef-Analogue-Pocket-Framework.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLicenseRef-Analogue-Pocket-Framework.txt\u003c/a\u003e).\nThat agreement says that where the GPL applies and its terms are inconsistent with the agreement,\nthe GPL prevails. PocketFin changes \u003ccode\u003ecore_bridge_cmd.v\u003c/code\u003e (save-on-exit fix) and \u003ccode\u003ecore_top.v\u003c/code\u003e\n(link block) by script; the changes are in \u003ccode\u003etools/pocket_save_exit_patch.py\u003c/code\u003e and\n\u003ccode\u003etools/prepare_pocket_media_core.py\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003eIntel/Altera megafunction IP\u003c/strong\u003e generated by Quartus (PLLs, block RAM, DDIO) and Quartus library\nmodules, Copyright (c) Intel Corporation, under the licence in\n\u003ca href=\"LICENSES/LicenseRef-Intel-FPGA-IP.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLicenseRef-Intel-FPGA-IP.txt\u003c/a\u003e: it may be used to program\nIntel/Altera devices, which is what the Pocket's FPGA is.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecram0_phy.sv\u003c/code\u003e, Copyright (c) 2022 Adam Gastineau, MIT (\u003ca href=\"LICENSES/MIT-cram0_phy.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMIT-cram0_phy.txt\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003ePocketFin's licence grants an additional permission to convey the bitstream with the Analogue\nPocket Framework and the Intel/Altera IP (\u003ca href=\"#ADDITIONAL-TERMS.md\"\u003eADDITIONAL-TERMS.md\u003c/a\u003e).\nThe Analogizer and other third-party video files in openfpgaCore are \u003cstrong\u003enot\u003c/strong\u003e part of this build\n(Quartus' list of source files read for the released bitstream does not include them).\u003c/p\u003e\n\u003cp\u003eThe kernel (\u003ccode\u003eos.bin\u003c/code\u003e) and the boot ROM also include:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cstrong\u003emusl libc\u003c/strong\u003e 1.2.5, Copyright (c) 2005-2020 Rich Felker, et al., MIT; musl's full COPYRIGHT\nfile is \u003ca href=\"LICENSES/MIT-musl-COPYRIGHT.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMIT-musl-COPYRIGHT.txt\u003c/a\u003e. The app (\u003ccode\u003epjlive.elf\u003c/code\u003e) links\nthe musl libc that ships in the openfpgaOS SDK, under the same licence.\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003edlmalloc\u003c/strong\u003e, Copyright 2023 Doug Lea, MIT-0 (\u003ca href=\"LICENSES/MIT-0-dlmalloc.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMIT-0-dlmalloc.txt\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cstrong\u003elib9660\u003c/strong\u003e, Copyright (c) 2014 Erin Shepherd, ISC (\u003ca href=\"LICENSES/ISC-lib9660.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eISC-lib9660.txt\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eVexiiRiscv\u003c/strong\u003e - \u003ca href=\"https://github.com/openfpgaOS/VexiiRiscv\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/openfpgaOS/VexiiRiscv\u003c/a\u003e (commit 580b76c), Copyright (c) 2023\nSpinalHDL, MIT (\u003ca href=\"LICENSES/MIT-VexiiRiscv.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eMIT-VexiiRiscv.txt\u003c/a\u003e; also\n\u003ccode\u003ecore/generated/VexiiRiscv-LICENSE.txt\u003c/code\u003e). \u003ccode\u003ecore/generated/VexiiRiscv_media.v\u003c/code\u003e was generated from it\nwith \u003cstrong\u003eSpinalHDL\u003c/strong\u003e (commit 6f8510c; core LGPL-3.0, library MIT; SpinalHDL states that generated RTL\nbelongs to the user) and rvls (commit 94f850e).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ecore_jpeg\u003c/strong\u003e - \u003ca href=\"https://github.com/ultraembedded/core_jpeg\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/ultraembedded/core_jpeg\u003c/a\u003e (commit bb03cce), Copyright 2020\nUltra-Embedded.com, Apache-2.0 (\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApache-2.0.txt\u003c/a\u003e). PocketFin's port\nremoves an unused RAM write port in four files and qualifies the input stage's marker detection;\nboth changes are marked \u003ccode\u003eLOCAL\u003c/code\u003e in the generated files and listed in\n\u003ccode\u003etools/prepare_pocket_media_core.py\u003c/code\u003e, and they are contributed under Apache-2.0 like the files they\nchange. The source is fetched, not included.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRoboto\u003c/strong\u003e (font) - Roboto Medium, version 2.138, Copyright 2011 Google Inc., Apache-2.0\n(\u003ca href=\"LICENSES/Apache-2.0.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eApache-2.0.txt\u003c/a\u003e), from \u003ca href=\"https://github.com/googlefonts/roboto-2\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/googlefonts/roboto-2\u003c/a\u003e (release\nv2.138; the download and file are pinned by SHA-256 in \u003ccode\u003eupstream.lock.json\u003c/code\u003e). The app's font atlas\n(\u003ccode\u003epocket/fonts/roboto-medium-18.a8\u003c/code\u003e) is rasterized directly from the font file by\n\u003ccode\u003etools/build_roboto_atlas.py\u003c/code\u003e, and \u003ccode\u003etools/build_ui_font.py\u003c/code\u003e scales it into \u003ccode\u003epocket/ui_font.h\u003c/code\u003e and\n\u003ccode\u003epocket/ui_font_large.h\u003c/code\u003e. These generated files stay under Apache-2.0; what was changed is described\nin \u003ca href=\"pocket/fonts/NOTICE.txt\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ethe font's notice\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJellyfin logo\u003c/strong\u003e - from \u003ca href=\"https://github.com/jellyfin/jellyfin-ux\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://github.com/jellyfin/jellyfin-ux\u003c/a\u003e (commit 69a2b7b), Copyright the\nJellyfin contributors, CC BY-SA 4.0 (\u003ca href=\"third_party/jellyfin-ux-branding/LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ethe logo's licence\u003c/a\u003e). Scaled and converted to the Pocket's formats by\n\u003ccode\u003etools/build_brand_assets.py\u003c/code\u003e (\u003ccode\u003epocket/ui_brand.h\u003c/code\u003e, the core icon and the platform image); no other\nchange. Those adapted images are under CC BY-SA 4.0 as well. \"Jellyfin\" is a trademark of its\nowners; PocketFin is not affiliated with or endorsed by the Jellyfin project.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eGCC runtime (libgcc)\u003c/strong\u003e - linked into the app by the RISC-V compiler; GPL-3.0 with the GCC Runtime\nLibrary Exception, which allows this use.\u003c/p\u003e\n\u003ch2 id=\"h-build-tools-not-shipped\"\u003eBuild tools (not shipped)\u003c/h2\u003e\n\u003cp\u003eIntel Quartus Prime Lite, the RISC-V GCC toolchain, MSYS2, Icarus Verilog, Python, fontTools, PyAV\nand FFmpeg are used to build and test but are not part of the release files. FFmpeg's \u003ccode\u003etestsrc2\u003c/code\u003e and\n\u003ccode\u003esine\u003c/code\u003e sources generate the demo video; the result contains no FFmpeg code.\u003c/p\u003e\n\u003ch2 id=\"h-trademarks\"\u003eTrademarks\u003c/h2\u003e\n\u003cp\u003eAnalogue and Analogue Pocket are trademarks of Analogue Enterprises Limited. Jellyfin is a trademark\nof its owners. ModRetro and Chromatic are trademarks of ModRetro, Inc. They are used here only to\nsay what PocketFin works with. PocketFin is an independent project, not affiliated with Analogue,\nModRetro or the Jellyfin project.\u003c/p\u003e"
},

"html":"\u003ch1 id=\"h-additional-terms-and-permissions-gnu-gpl-version-3-section-7\"\u003eAdditional terms and permissions (GNU GPL version 3, section 7)\u003c/h1\u003e\n\u003cp\u003ePocketFin is free software under the GNU General Public License, version 3 or (at your option) any\nlater version. The full licence is in \u003ca href=\"LICENSE\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eLICENSE\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eThe following additional permission and additional terms apply to the parts of PocketFin written by\nits author, ChaoticSPARTAN1 (and to contributions accepted under the same terms, see\n\u003ca href=\"#CONTRIBUTING.md\"\u003eCONTRIBUTING.md\u003c/a\u003e).\u003c/p\u003e\n\u003ch2 id=\"h-additional-permission-for-the-fpga-bitstream-section-7\"\u003eAdditional permission for the FPGA bitstream (section 7)\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003eIf you modify this Program, or any covered work, by combining or linking it with the Analogue\nPocket Framework (or a modified version of it) or with Intel/Altera FPGA IP generated by Intel\nQuartus (including megafunctions such as PLLs, RAM, FIFOs and DDIO, and Quartus library modules),\nthe licensors of this Program grant you additional permission to convey the resulting work,\nincluding FPGA bitstreams. Corresponding Source for a non-source form of such a combination need\nnot include the source code of those parts, which remain under their own licences.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAs section 7 of the GPL allows, anyone who conveys a copy may remove this additional permission from\nthat copy (and from works based on it).\u003c/p\u003e\n\u003ch2 id=\"h-additional-terms-sections-7b-and-7c\"\u003eAdditional terms (sections 7(b) and 7(c))\u003c/h2\u003e\n\u003cblockquote\u003e\n\u003cp\u003e\u003cstrong\u003eAuthor attribution (section 7(b)).\u003c/strong\u003e If you convey PocketFin or a work based on it, in source or\nin binary form, you must keep the author attribution \"ChaoticSPARTAN1\" (for example \"Created by\nChaoticSPARTAN1\") in the credits section of the README or equivalent documentation, and in any\nAbout, Credits or similar screen that the program displays. You may add your own name next to it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOrigin (section 7(c)).\u003c/strong\u003e You may not remove that attribution or otherwise misrepresent the origin\nof the material, for example by presenting the work as if it had no original author.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eThe first term is a requirement to preserve a reasonable author attribution in the sense of section\n7(b); the second prohibits misrepresentation of the origin of the material in the sense of section\n7(c). Neither restricts anything else the GPL allows. If you receive a copy where this notice was\nremoved, these terms still apply.\u003c/p\u003e\n\u003cp\u003eThird-party parts keep their own licences and notices; see\n\u003ca href=\"#THIRD-PARTY-NOTICES.md\"\u003eTHIRD-PARTY-NOTICES.md\u003c/a\u003e.\u003c/p\u003e"

<script>
(function () {
  var data = JSON.parse(document.getElementById('docs-data').textContent);
  var pages = {}, order = [];
  data.groups.forEach(function (g) { g.pages.forEach(function (p) { p.group = g.name; pages[p.path] = p; order.push(p.path); }); });
  var current = null;
  function el(id) { return document.getElementById(id); }
  function link(text, hash, cls) {
    var a = document.createElement('a'); a.textContent = text; a.href = '#' + hash; if (cls) a.className = cls; return a;
  }
  function parse() {
    var h = location.hash.slice(1);
    try { h = decodeURIComponent(h); } catch (e) {}
    var cut = h.indexOf(':'), path = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? '' : h.slice(cut + 1);
    if (!pages[path]) { path = order[0]; anchor = ''; }
    return { path: path, anchor: anchor };
  }
  function nav(page) {
    var tabs = el('tabs'), list = el('pages');
    tabs.textContent = ''; list.textContent = '';
    data.groups.forEach(function (g) {
      tabs.appendChild(link(g.name, g.pages[0].path, g.name === page.group ? 'on' : ''));
      if (data.theme === 'chroma' && g.name !== page.group) return;
      var head = document.createElement('div'); head.className = 'group'; head.textContent = g.name; list.appendChild(head);
      g.pages.forEach(function (p) { list.appendChild(link(p.title, p.path, p.path === page.path ? 'on' : '')); });
    });
  }
  function show() {
    var where = parse(), page = pages[where.path];
    if (current !== page) {
      el('page').innerHTML = page.html;
      el('title').textContent = page.title;
      el('crumb').textContent = data.project + ' / ' + page.path;
      document.title = page.title + ' \u00b7 ' + data.project + ' documentation';
      nav(page);
      current = page;
    }
    var target = where.anchor && document.getElementById('h-' + where.anchor.toLowerCase());
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
